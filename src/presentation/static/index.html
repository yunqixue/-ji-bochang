  /* ============ 涓婚锛氱敎缇庡紡 ============ */

  /* 涓婚涓嬫媺妗嗭細璺?chip 鍚屼竴濂楀瑙?*/
  select.chip {

  /* ============ 褰㈣薄鍔ㄤ綔 ============ */
  @keyframes floaty {

  }
  @keyframes tilt {

  @keyframes listenPulse {
    0%   { opacity: .95; }

  /* 寰呮満锛氬懠鍚?+ 杞诲井鎽囨憜锛堣鐩栧師鏉ョ殑绾缉鏀撅級 */
  .avatar-frame { animation: floaty 6s ease-in-out infinite; }

  /* 鍦ㄥ惉锛氱◢蹇竴鐐癸紝鍔犱竴鍦堝懠鍚告尝绾?*/
  .stage[data-state="listening"] .avatar-frame { animation: floaty 3.4s ease-in-out infinite; }
  .stage[data-state="listening"] .avatar-frame::after {

  .stage[data-state="thinking"] .avatar-frame { animation: tilt 3.2s ease-in-out infinite; }

  /* ==================================================================
     瑙嗚澧炲己灞傦紙B锛?026-10-24锛?     瑙ｅ喅涓変釜"鐪嬬潃鍗曡杽"鐨勯棶棰橈細
       鈶?閫氳瘽瑙嗗浘宸﹀彸澶х墖绌虹櫧  鈫?鐢ㄥ悓涓€寮犲浘鏀惧ぇ妯＄硦褰撹儗鏅紙鍍忚棰戦€氳瘽鐨勮儗鏅櫄鍖栵級
       鈶?褰㈣薄鏄鍥剧墖          鈫?璇磋瘽鏃舵寜鐪熷疄闊抽噺鍋氱粏寰帹杩戯紝鎹㈣〃鎯呮椂闂竴涓嬫煍鍏?       鈶?绌鸿亰澶╁尯浠€涔堥兘娌℃湁    鈫?鍔犳杩庡崱 + 涓変釜涓€閿瘽棰?     鍋氭硶锛氬彧鍔犳柊绫诲悕鍜?CSS 鍙橀噺 --voice锛屼笉鏀逛换浣曞凡鏈夌被鐨勫惈涔夈€?     鍑洪棶棰樺彲浠ョ洿鎺ュ垹鎺夎繖涓€娈碉紝椤甸潰浼氬洖鍒板師鏉ョ殑鏍峰瓙銆?     ================================================================== */

  :root { --voice: 0; }

  /* --- 鈶?鑸炲彴鑳屾櫙铏氬寲锛氭妸绌虹殑鍦版柟濉弧 --- */
  .stage-bg {
    position: absolute;
    inset: -14%;
    z-index: 0;
    pointer-events: none;
    opacity: .82;
    filter: blur(18px) saturate(1.35) brightness(.9);
    transform: scale(1.08);
    /* 鍒囦富棰樻椂涓嶈烦鍙橈細妯＄硦/浜害骞虫粦杩囨浮锛岄伩鍏?鑳屾櫙琚媺杩?鐨勯敊瑙?*/
    transition: filter 420ms ease, opacity 420ms ease;
  }
  .stage-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    display: block;
    /* 鍔ㄦ€佽儗鏅細鏋佹參鐨勬帹杩?+ 杞诲井婕傜Щ锛屽儚闀滃ご鍦ㄥ懠鍚?*/
    animation: bgKenBurns 42s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes bgKenBurns {
    from { transform: scale(1) translate3d(0, 0, 0); }
    to   { transform: scale(1.09) translate3d(-1.6%, -1.2%, 0); }
  }
  /* 杈圭紭鍘嬫殫锛屾妸瑙嗙嚎鏀跺洖鍒颁腑闂寸殑浜鸿韩涓婏紙鍙綔鐢ㄥ湪鑳屾櫙涓婏紝涓嶇洊鑴革級 */
  .stage-tint {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(115% 80% at 50% 42%, transparent 52%, rgba(0, 0, 0, .34) 100%);
  }
  /* 鈽?鑳屾櫙锛堣垶鍙拌櫄鍖栧眰 + 杈圭紭鍘嬫殫锛変笉闅忎富棰樺彉鍖栵細涓婚鍙 UI 閰嶈壊锛岃儗鏅睘浜庡唴瀹广€?     鍘熸潵姣忎釜涓婚缁欎簡涓嶅悓鐨?brightness/saturate锛屾繁鑹蹭富棰樿繕棰濆鍙犱簡闇撹櫣鍏夛紝
     涓€鍒囨崲鍏夋劅鑳屾櫙灏辫窡鐫€鍙?鈥斺€?鐪嬭捣鏉ュ儚"鎹簡寮犺儗鏅?銆傜幇鍦ㄧ粺涓€鎴愪竴濂楀弬鏁般€?*/
  .stage-bg { opacity: .78; filter: blur(20px) saturate(1.18) brightness(.95); }
  .stage-tint {
    background: radial-gradient(115% 80% at 50% 42%, transparent 54%, rgba(0, 0, 0, .26) 100%);
  }
  /* 鑳屾櫙涓嬫柟鍘嬫殫锛岃鐢婚潰鑷劧杩囨浮鍒板瓧骞曞尯锛屼笉瑕佷竴鍒€鍒?*/
  .stage-tint::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34%;
    background: linear-gradient(to top, rgba(0, 0, 0, .34), transparent);
  }

  /* --- 鈶?褰㈣薄鍔ㄦ晥锛氫竴鏉?transform 鍚屾椂绠′袱浠朵簨 ---
     路 闅忓０闊虫帹杩戯細--voice锛圝S 鎸?mp3 瀹炴椂闊抽噺鍐欏叆锛?     路 鐩厜璺熼殢锛?-gx / --gy锛圕 鍔犵殑锛岄紶鏍囧湪鑸炲彴閲岀Щ鍔ㄦ椂鍐欏叆锛?0.5 ~ +0.5锛?     鈽?蹇呴』鍐欏湪鍚屼竴鏉?transform 閲岋細transform 鏄鐩栧瀷灞炴€э紝鍒嗗紑鍐欏悗闈㈤偅鏉′細鎶婂墠闈㈤偅鏉￠《鎺夈€?     瀹炴祴杩囦竴娆★細涓ゆ潯鍒嗗紑鍐欐椂锛岄紶鏍囧仠鍦ㄨ垶鍙颁笂锛?-gx 鏈夊€硷級"闅忓０闊虫帹杩?灏辨暣涓け鏁堜簡銆?*/
  .avatar-img {
    transform:
      scale(calc(1 + var(--voice, 0) * 0.035))
      translate(calc(var(--gx, 0) * 5px), calc(var(--gy, 0) * 4px));
    transition: opacity 200ms ease-in-out, transform 140ms ease-out;
  }

  /* 鎹㈣〃鎯呮椂闂竴涓嬫煍鍏夛紝璁?鎹㈣劯"鐪嬭捣鏉ユ槸涓诲姩鐨勮〃鎯呭彉鍖栵紝涓嶆槸鍥剧墖鎹簡銆?     鍒绘剰鍙鐩栦汉鐗╃敾闈㈡湰韬紙鏀惧湪 .avatar-frame 閲岋級锛屼笉闂暣涓垶鍙般€?*/
  .stage-flash {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    border-radius: inherit;
    background: radial-gradient(58% 46% at 50% 34%, rgba(255, 238, 220, .5), transparent 72%);
  }
  .stage-flash.fire { animation: exprFlash 520ms ease-out; }

  @keyframes exprFlash {
    0%   { opacity: 0; }
    22%  { opacity: .5; }
    100% { opacity: 0; }
  }

  /* --- 澹伴煶娉㈠舰锛氬彧鍦ㄨ璇濇椂浜捣鏉ワ紝楂樺害璺熺潃 --voice 璧?--- */
  .voice-wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 24px;
    margin: 0 0 4px;
    color: #7fd4ff;
    opacity: 0;
    transition: opacity 260ms ease;
  }
  .voice-wave.on { opacity: 1; }
  .voice-wave i {
    display: block;
    width: 3px;
    border-radius: 3px;
    background: currentColor;
    height: calc(5px + var(--voice, 0) * 20px * var(--k, 1));

     銆岃嚜鍔ㄣ€嶆ā寮忥紙杩樻病閫夊満鏅級瀹屽叏涓嶅彈褰卞搷锛岃繕鏄師鏉ラ偅濂楄窡鐫€琛ㄦ儏铏氬寲銆?*/

     灏卞啓鍦ㄥ悗闈紝缁撴灉鏁村潡鐧藉簳鎶婂満鏅浘鐩栦綇浜嗭紙瀹炴祴鎴浘閲屼腑澶竴澶х墖鍙戠櫧锛夈€?*/

  /* ===== 妗岄潰灏忎汉娴眰锛圔 杩藉姞锛寁2锛?====
     鈶?姘旀场鍋氭垚"鎬濊€冩皵娉?锛氭き鍦嗗渾瑙?+ 娣辫摑鎻忚竟 + 涓変釜鐢卞ぇ鍒板皬鐨勫渾鐐瑰熬宸达紙鐓х敤鎴风粰鐨勫弬鑰冨浘锛?     鈶?鐪ㄧ溂锛氭崲鐪熷疄鐨勯棴鐪肩珛缁?     鈶?璇磋瘽锛氬湪 q_<琛ㄦ儏> 涓?q_talk锛堝紶鍢达級涔嬮棿蹇€熶氦鏇匡紝鍍忓湪璁茶瘽
     鈶?寰呮満闅忔満灏忓姩浣滐細韫︿竴涓?/ 鎽囨憜 / 姝ご / 宸﹀彸鎸?/ 榧撹捣
     鈶?姘村嵃宸蹭粠绱犳潗灞傞潰娓呮帀锛堟姞鍥炬椂鍙繚鐣欐渶澶ц繛閫氬煙锛?AI 鐢熸垚"閭ｄ覆瀛椾笌璐寸焊涓嶇浉杩烇紝浼氳鏁翠綋涓㈠純锛?*/
  .pet-layer {
    position: fixed;
    right: 200px;   /* 璁╁紑鍙充笅瑙掔殑"鎽勫儚澶存湭寮€"灏忕獥 */
    /* 鈽?鐣欏嚭搴曢儴杈撳叆妗嗙殑楂樺害锛氬皬浜轰細鍚冪偣鍑伙紝鍘嬪湪"鍙戦€?鎸夐挳涓婂氨鐐逛笉鍒颁簡锛堝疄娴嬪彂鐜帮級 */
    bottom: 152px;
    z-index: 60;
    width: 128px;
    pointer-events: none;
  }
  .pet-layer[hidden] { display: none; }
  html[data-pet="0"] .pet-layer { display: none; }
  .pet-body {
    position: relative;
    width: 100%;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 10px 18px rgba(20, 30, 45, .32));
    transform-origin: 50% 100%;
    animation: petBreathe 4.2s ease-in-out infinite;
    transition: transform 140ms ease-out;
    touch-action: none;
  }
  .pet-body:hover { transform: scale(1.04); }
  .pet-body img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }

  @keyframes petBreathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.015) translateY(-2px); }
  }
  /* 寰呮満灏忓姩浣滐細鍐欐垚"涓€娆℃€?鍔ㄧ敾锛岀敱 JS 鍔犵被瑙﹀彂銆佸姩鐢荤粨鏉熷啀鎽樻帀 */
  .pet-body.act-hop   { animation: petHop 560ms cubic-bezier(.3,.9,.3,1); }
  .pet-body.act-sway  { animation: petSway 1400ms ease-in-out; }
  .pet-body.act-lean  { animation: petLean 1200ms ease-in-out; }
  .pet-body.act-slide { animation: petSlide 1800ms ease-in-out; }
  .pet-body.act-pulse { animation: petPulse 900ms ease-in-out; }
  .pet-body.act-shake { animation: petShake 700ms ease-in-out; }
  @keyframes petHop {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-22px) scale(1.05, .96); }
    55% { transform: translateY(0) scale(.97, 1.04); }
    75% { transform: translateY(-6px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes petSway {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    60% { transform: rotate(4deg); }
  }
  @keyframes petLean {
    0%, 100% { transform: rotate(0) translateX(0); }
    35% { transform: rotate(-6deg) translateX(-4px); }
    70% { transform: rotate(-2deg) translateX(2px); }
  }
  @keyframes petSlide {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-26px); }
    65% { transform: translateX(14px); }
  }
  @keyframes petPulse {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.09); }
  }
  @keyframes petShake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(3deg); }
    40% { transform: rotate(-3deg); }
    60% { transform: rotate(2deg); }
    80% { transform: rotate(-2deg); }
  }

  /* 鎽稿ご锛氱偣涓嬪幓鏃跺ご琚寜浣忋€佹暣涓韩浣撹鍘嬫墎涓嬫矇锛屾澗鎵嬪悗寮硅捣鐣ュ井瓒呰繃鍘熼珮搴﹀啀鍥炵ǔ銆?     transform-origin 鍦ㄥ簳閮紝鎵€浠?缂?鏄粠澶村線涓嬪帇锛岃€屼笉鏄暣浣撶缉鏀俱€?*/
  .pet-body.act-pat { animation: petPat 780ms cubic-bezier(.22,.9,.3,1); }
  @keyframes petPat {
    0%   { transform: scale(1, 1) translateY(0); }
    14%  { transform: scale(1.10, .80) translateY(18px); }
    32%  { transform: scale(.94, 1.09) translateY(-11px); }
    50%  { transform: scale(1.04, .97) translateY(3px); }
    68%  { transform: scale(.99, 1.02) translateY(-3px); }
    84%  { transform: scale(1.01, .995) translateY(1px); }
    100% { transform: scale(1, 1) translateY(0); }
  }
  /* 鎽稿ご鏃跺ご椤跺啋涓€涓皬鐖卞績 */
  .pet-heart {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translate(-50%, 0) scale(.6);
    font-size: 26px;
    color: #ff6b8a;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(255, 107, 138, .45);
  }
  .pet-heart.on { animation: petHeart 880ms ease-out; }
  @keyframes petHeart {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.5); }
    25%  { opacity: 1; transform: translate(-50%, -6px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(.9); }
  }

  /* ---- 鎬濊€冩皵娉★紙鐓у弬鑰冨浘锛氱櫧搴?+ 娣辫摑鎻忚竟 + 涓夌偣灏惧反锛?--- */
  .pet-bubble {
    position: absolute;
    right: 4px;
    bottom: calc(100% + 26px);
    max-width: 250px;
    padding: 12px 18px;
    border-radius: 22px / 24px;
    background: #fffdf8;
    color: #1f3a5f;
    font-size: 13.5px;
    line-height: 1.6;
    font-weight: 600;
    text-align: center;
    border: 2.5px solid #24466f;
    box-shadow: 0 10px 24px -12px rgba(20, 40, 70, .45);
    opacity: 0;
    transform: translateY(6px) scale(.96);
    transform-origin: 90% 100%;
    transition: opacity 200ms ease, transform 220ms cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none;
    white-space: pre-wrap;
  }
  .pet-bubble.on { opacity: 1; transform: translateY(0) scale(1); }
  /* 涓夌偣灏惧反锛氫粠澶у埌灏忔湞灏忎汉澶撮《鏂瑰悜鎺掍笅鍘?*/
  .pet-bubble i {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: #fffdf8;
    border: 2.5px solid #24466f;
  }
  .pet-bubble i.t1 { width: 13px; height: 11px; right: 16px; bottom: -12px; }
  .pet-bubble i.t2 { width: 8px;  height: 7px;  right: 8px;  bottom: -24px; }
  .pet-bubble i.t3 { width: 5px;  height: 4px;  right: 4px;  bottom: -33px; }

  function canRecord() {

  function pickMime() {
    var cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    for (var i = 0; i < cands.length; i++) {

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {

        recorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) { chunks.push(e.data); }
        };

        recorder.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          var blob = new Blob(chunks, { type: mime || "audio/webm" });
          chunks = [];
          if (blob.size < 1200) { hint("杩欐澶煭浜嗭紝璇村畬鏁翠竴鍙ャ€?, true); return; }
          send({ audio: blob });

        recordTimer = setTimeout(function () {
          if (isRecording) { stopRecording(); }

      .catch(function (err) {
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          hint("楹﹀厠椋庤娴忚鍣ㄦ嫤浜嗭紝鐐瑰湴鍧€鏍忕殑鍥炬爣鍏佽涓€涓嬨€?, true);

const api = {
  get ready() { return ready; },

  // 鎯呯华鍒囨崲锛堟病灏辩华鏃跺厛璁颁笅鏉ワ紝灏辩华鍚庤ˉ搴旂敤锛?  mood(label) {
    pendingMood = label;
    if (ready && head) {
      try { head.setMood(MOOD_MAP[label] || 'neutral'); } catch (e) { }
    }
  },

  // 鎾斁鍥炲璇煶 + 鍙ｅ瀷鍚屾銆傝繑鍥?Promise<boolean>锛歠alse = 娌℃帴浣忥紝璋冪敤鏂硅蛋 2D 鍏滃簳
  async speak(url, lipsync, onended) {
    if (!ready || !head) { return false; }
    try {
      const buf = await (await fetch(url)).arrayBuffer();
      const audio = await head.audioCtx.decodeAudioData(buf);
      if (head.audioCtx.state === 'suspended') {
        try { await head.audioCtx.resume(); } catch (e) { }
      }
      const payload = { audio };
      if (lipsync && lipsync.words && lipsync.words.length) {
        payload.words = lipsync.words;
        payload.wtimes = lipsync.wtimes;
        payload.wdurations = lipsync.wdurations;
      }
      head.speakAudio(payload, { lipsyncLang: 'zh' });
      startMeter();

      // TalkingHead 娌℃湁瀵瑰鏆撮湶"鎾畬"鍥炶皟锛岃疆璇㈢姸鎬佷綅鍒ゆ柇
      if (speakPoll) { clearInterval(speakPoll); }
      let seen = false;
      speakPoll = setInterval(function () {
        const speaking = head.isSpeaking || head.isAudioPlaying;
        if (speaking) { seen = true; }
        if (seen && !speaking) {
          clearInterval(speakPoll); speakPoll = null;
          stopMeter();
          if (onended) { onended(); }
        }
      }, 150);
      return true;
    } catch (e) {
      console.warn('[avatar3d] speak 澶辫触锛屽洖閫€ 2D 鎾斁锛?, e);
      return false;
    }
  },

  stop() {
    if (speakPoll) { clearInterval(speakPoll); speakPoll = null; }
    stopMeter();
    if (ready && head) { try { head.stopSpeaking(); } catch (e) { } }
  },

  // 瑙嗗浘鍒囨崲锛氭妸鍚屼竴涓?3D 鐢诲竷鎼埌褰撳墠瑙嗗浘鐨勬寕杞界偣
  attach(view) {
    if (!ready || !head) { return; }
    const mp = mountPoint(view);
    if (mp && head.nodeAvatar.parentNode !== mp) { mp.appendChild(head.nodeAvatar); }
    try { head.onResize(); } catch (e) { }
  },

  // 鐢ㄦ埛褰曢煶鏃讹紝鎶婇害鍏嬮娴佹帴杩涙潵 鈥斺€?濂逛細鐪嬪悜璇磋瘽鐨勪汉銆佹湁"鍦ㄥ惉"鐨勫ご閮ㄥ弽搴?  listen(stream) {
    if (!ready || !head || !stream) { return; }
    try {
      if (!listenAnalyser) { listenAnalyser = head.audioCtx.createAnalyser(); }
      listenSrc = head.audioCtx.createMediaStreamSource(stream);
      listenSrc.connect(listenAnalyser);
      head.startListening(listenAnalyser);
    } catch (e) { }
  },

  stopListen() {
    try { if (ready && head) { head.stopListening(); } } catch (e) { }
    try { if (listenSrc) { listenSrc.disconnect(); } } catch (e) { }
    listenSrc = null;
  }
};
window.avatar3d = api;

async function boot() {
  try {
    if (!window.WebGL2RenderingContext) { return; }
    // 鈽?榛樿鐢?2D 绔嬬粯锛欰 鐨?7 寮犺〃鎯呭氨鏄鑹叉湰浜猴紝闀跨浉涓€鑷淬€佸拰瑙嗛涔熺粺涓€銆?    //   鎯崇湅 3D 灏卞湪鍦板潃鍚庡姞 ?avatar3d=1锛堢ず渚嬫ā鍨嬮暱鐩稿拰瑙掕壊涓嶄竴鑷达紝榛樿涓嶅睍绀猴級銆?    if (!/[?&](avatar3d=1|avatar=3d)\b/.test(location.search)) {
      console.info("[avatar3d] 榛樿 2D 绔嬬粯锛涜鐪?3D 璇峰姞 ?avatar3d=1");
      return;
    }

    // 妯″瀷鏂囦欢涓嶅瓨鍦ㄥ氨涓嶅惎鍔紙probe 鐢?HEAD锛屽嚑绉掑氨鑳藉嚭缁撴灉锛?    const probe = await fetch(GLB_URL, { method: 'HEAD' });
    if (!probe.ok) {
      console.info('[avatar3d] 鏈壘鍒?3D 妯″瀷 ' + GLB_URL + '锛屾部鐢?2D 绔嬬粯銆傝幏鍙栨柟娉曡 static/avatar/涓嬭浇褰㈣薄妯″瀷.md');
      return;
    }

    const mount = document.createElement('div');
    mount.className = 'avatar3d-canvas';
    mountPoint(document.getElementById('view-chat').hidden ? 'call' : 'chat').appendChild(mount);

    head = new TalkingHead(mount, {
      lipsyncLang: 'zh',
      lipsyncModules: ['zh'],          // 鍙姞杞芥湰鍦颁腑鏂囨ā鍧楋紙榛樿鐨?fi/en/lt 娌℃墦鍖呰繘鏉ワ級
      cameraView: 'upper',             // 涓婂崐韬彇鏅紝閫傚悎瀵硅瘽鍦烘櫙
      cameraRotateEnable: false,
      cameraZoomEnable: false,
      modelPixelRatio: Math.min(2, window.devicePixelRatio || 1),
      // TalkingHead 鏋勯€犲嚱鏁扮‖鎬ц姹?ttsEndpoint 闈炵┖锛屽摢鎬曟垜浠彧鐢?speakAudio銆?      // 濉竴涓湡瀹炲瓨鍦ㄤ絾姘歌繙涓嶄細琚畠璋冪敤鐨勫湴鍧€鍗冲彲銆?      ttsEndpoint: '/api/tts'
    });

    await head.showAvatar({
      url: GLB_URL,
      body: 'F',
      avatarMood: 'neutral',
      lipsyncLang: 'zh'
    });
    head.setView('upper');
    patchMorphAliases(head);

    // 绛変腑鏂囧攪褰㈡ā鍧楀姩鎬?import 瀹屾垚锛堟渶澶?3 绉掞紝绛変笉鍒颁篃鑳芥挱锛屽彧鏄彛鍨嬬敤涓嶄笂瑙嗙礌锛?    const t0 = Date.now();
    while (!head.lipsync['zh'] && Date.now() - t0 < 3000) {
      await new Promise(function (r) { setTimeout(r, 100); });
    }

    // 娴忚鍣ㄨ嚜鍔ㄦ挱鏀剧瓥鐣ワ細棣栨鐐瑰嚮/鎸夐敭鏃舵仮澶嶉煶棰戜笂涓嬫枃
    ['pointerdown', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        try { head.audioCtx.resume(); } catch (e) { }
      }, { passive: true });
    });

    head.setMood(MOOD_MAP[pendingMood] || 'neutral');
    ready = true;
    document.querySelectorAll('.stage').forEach(function (s) { s.setAttribute('data-avatar3d', '1'); });
    api.attach(document.getElementById('view-chat').hidden ? 'call' : 'chat');
    console.info('[avatar3d] 3D 褰㈣薄宸插氨缁?);
  } catch (e) {
    console.warn('[avatar3d] 鍒濆鍖栧け璐ワ紝娌跨敤 2D 绔嬬粯锛?, e);
    try { if (head) { head.stop(); } } catch (e2) { }
    head = null;
    ready = false;
  }
}

boot();
</script>
