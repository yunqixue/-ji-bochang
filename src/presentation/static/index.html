<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小雨 · 情感陪伴</title>
<!--
  聊天页面（C 的产出）。对应 docs/接口契约.md v0.3。

  设计约束（三天冲刺，别加东西）：
    · 单文件、零依赖、零构建 —— 演示现场断网也能开
    · 不依赖 response.debug / perception.raw（契约 §1 硬规则 6）
    · 形象图缺一张也不能白屏：图加载失败一律落到占位块（任务板 D2 要求）
    · 换表情走 200ms 交叉淡入，不直接改 src（契约 §1）
-->
<style>
  :root {
    --bg: #f7f2ea;
    --panel: #fffdfa;
    --line: #e7ddcf;
    --ink: #3a332c;
    --muted: #8d8377;
    --accent: #c98a5b;
    --accent-soft: #f6e7d8;
    --user-bubble: #e8f0f6;
    --danger: #d1495b;
    --ok: #4f9d69;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(90, 70, 45, .08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #fdf3e6 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 28px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 顶栏 ---------- */
  header.top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 2px 4px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    font-size: 19px;
    margin: 0;
    letter-spacing: .3px;
    font-weight: 650;
  }

  .brand .sub {
    font-size: 12px;
    color: var(--muted);
  }

  .spacer { flex: 1; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    white-space: nowrap;
  }

  .dot i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #c9c0b3;
  }

  .dot.on i { background: var(--ok); }
  .dot.off i { background: var(--danger); }

  /* ---------- 两栏 ---------- */
  main.main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 16px;
  }

  /* ---------- 形象 ---------- */
  .stage-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 300px;
    border-radius: 14px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 10%, #fdf1e3 0%, #f3e6d6 55%, #ece0cf 100%);
    display: grid;
    place-items: center;
  }

  /* 形象本体：呼吸 + 说话两种动效，靠 data-state 切 */
  .avatar-frame {
    position: relative;
    width: 78%;
    aspect-ratio: 1 / 1;
    max-width: 260px;
    display: grid;
    place-items: center;
    animation: breathe 4.2s ease-in-out infinite;
  }

  .stage[data-state="speaking"] .avatar-frame {
    animation: breathe 2.1s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }

  /* 说话时的光圈 */
  .stage[data-state="speaking"] .avatar-frame::after {
    content: "";
    position: absolute;
    inset: -6%;
    border-radius: 50%;
    border: 2px solid rgba(201, 138, 91, .45);
    animation: halo 1.4s ease-out infinite;
  }

  @keyframes halo {
    0%   { transform: scale(.94); opacity: .85; }
    100% { transform: scale(1.12); opacity: 0; }
  }

  .avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 200ms ease-in-out;   /* 契约：交叉淡入 200ms */
    user-select: none;
    -webkit-user-drag: none;
  }

  .avatar-img.active { opacity: 1; }

  /* 图还没有/加载失败时的兜底块 —— 演示绝不能是空白 */
  .avatar-fallback {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    gap: 2px;
    background: radial-gradient(circle at 50% 35%, #fff 0%, #f2e2ce 70%, #e9d6bf 100%);
    border: 1px solid #e6d5c0;
    transition: background 300ms ease;
  }

  .avatar-fallback .face {
    font-size: 54px;
    line-height: 1;
    transition: transform 200ms ease;
  }

  .avatar-fallback .cap {
    font-size: 12px;
    color: #9c8871;
    letter-spacing: .5px;
  }

  .stage[data-state="speaking"] .avatar-fallback .face {
    animation: talk 520ms ease-in-out infinite;
  }

  @keyframes talk {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-3px) scaleY(1.04); }
  }

  /* 情绪徽章 */
  .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #7a5535;
    border: 1px solid #efdcc6;
  }

  .badge.state { background: #eef4ef; color: #456b52; border-color: #dbe8df; }

  /* 效价 / 唤醒度小条：演示时能看出"识别到了什么" */
  .meters {
    display: grid;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }

  .meter {
    display: grid;
    grid-template-columns: 52px 1fr;
    align-items: center;
    gap: 10px;
  }

  .meter .track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: #efe6d9;
    overflow: hidden;
  }

  .meter .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #e0b48c, #c98a5b);
    transition: width 320ms ease;
  }

  .meter .fill.neg { background: linear-gradient(90deg, #8fb0d8, #5b7fb5); }

  /* ---------- 聊天 ---------- */
  .chat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .row { display: flex; gap: 8px; max-width: 86%; }
  .row.me { margin-left: auto; flex-direction: row-reverse; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.7;
    border: 1px solid var(--line);
    background: #fff;
  }

  .row.them .bubble { border-top-left-radius: 5px; }
  .row.me .bubble {
    border-top-right-radius: 5px;
    background: var(--user-bubble);
    border-color: #d7e4ee;
  }

  .bubble.err {
    border-color: #f0c9cd;
    background: #fdf2f3;
    color: #8c3b45;
    font-size: 13.5px;
  }

  .meta {
    font-size: 11.5px;
    color: #a99e90;
    margin-top: 4px;
    padding: 0 4px;
  }

  .row.me .meta { text-align: right; }

  /* 打字指示 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%;
    background: #c3b7a8;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- 输入区 ---------- */
  .composer {
    border-top: 1px solid var(--line);
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fffdfa;
  }

  .composer .line {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  input[type="text"]:focus {
    border-color: #dcc0a2;
    box-shadow: 0 0 0 3px rgba(201, 138, 91, .12);
  }

  input[type="text"]:disabled { background: #f7f2ec; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 12px;
    border: 1px solid transparent;
    padding: 11px 18px;
    transition: transform 120ms ease, background 160ms ease, opacity 160ms ease;
    white-space: nowrap;
  }

  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .btn-send {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .btn-send:hover:not(:disabled) { background: #bb7b4c; }

  .btn-mic {
    background: #fff;
    border-color: var(--line);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .btn-mic:hover:not(:disabled) { border-color: #dcc0a2; }

  .btn-mic.rec {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .btn-mic .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  .btn-mic.rec .pulse { animation: blink 900ms infinite; }

  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
    padding: 7px 12px;
    font-size: 12.5px;
  }

  .btn-ghost:hover { color: var(--ink); border-color: #dcc0a2; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    min-height: 18px;
  }

  .hint.warn { color: #a8763f; }

  @media (max-width: 820px) {
    main.main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    .stage { min-height: 240px; }
    .stage-card { padding: 14px; }
    .app { padding: 14px 14px 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>小雨</h1>
      <span class="sub">情感陪伴 · 三天冲刺演示</span>
    </div>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot" id="dot-asr"><i></i>语音识别</span>
      <span class="dot" id="dot-tts"><i></i>语音输出</span>
      <button class="btn-ghost" id="btn-reset" type="button">重开一轮</button>
    </div>
  </header>

  <main class="main">
    <!-- 左：形象 -->
    <section class="stage-card">
      <div class="stage" id="stage" data-state="idle">
        <div class="avatar-frame">
          <img class="avatar-img" id="avatar-a" alt="">
          <img class="avatar-img" id="avatar-b" alt="">
          <div class="avatar-fallback" id="avatar-fallback">
            <div class="face" id="fallback-face">🙂</div>
            <div class="cap" id="fallback-cap">表情占位 · 平静</div>
          </div>
        </div>
      </div>

      <div class="badges">
        <span class="badge" id="badge-emotion">她的表情 · 平静</span>
        <span class="badge state" id="badge-state">待机</span>
      </div>

      <div class="meters">
        <div class="meter">
          <span>你的情绪</span>
          <span class="track"><span class="fill" id="meter-valence"></span></span>
        </div>
        <div class="meter">
          <span>激动程度</span>
          <span class="track"><span class="fill" id="meter-arousal"></span></span>
        </div>
      </div>

      <div class="hint" id="hint">形象图还没到位，先用占位块顶着。</div>
    </section>

    <!-- 右：对话 -->
    <section class="chat-card">
      <div class="log" id="log"></div>
      <div class="composer">
        <div class="line">
          <input type="text" id="text" placeholder="想说什么就说，Enter 发送" autocomplete="off">
          <button class="btn-mic" id="btn-mic" type="button" title="点一下开始录音，再点一下发送">
            <span class="pulse"></span><span id="mic-label">录音</span>
          </button>
          <button class="btn-send" id="btn-send" type="button">发送</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  // ---------------- 常量 ----------------
  var API_CHAT = "/api/chat";
  var API_RESET = "/api/reset";
  var API_HEALTH = "/api/health";
  var SESSION_KEY = "emotion_agent_session_id";
  var MAX_RECORD_MS = 30000;

  // 契约 §4：三层 + 形象同一套标签。前端只做展示，不判断情绪。
  var EMOTION = {
    neutral:   { cn: "平静", face: "🙂" },
    happy:     { cn: "开心", face: "😊" },
    sad:       { cn: "难过", face: "😢" },
    anxious:   { cn: "紧张", face: "😰" },
    angry:     { cn: "生气", face: "😠" },
    surprised: { cn: "惊讶", face: "😮" },
    empathic:  { cn: "关切", face: "🥺" }
  };

  var STATE_CN = { idle: "待机", thinking: "在想", speaking: "说话中", listening: "在听" };

  // ---------------- DOM ----------------
  function $(id) { return document.getElementById(id); }
  var logEl = $("log"), stageEl = $("stage"), inputEl = $("text");
  var sendBtn = $("btn-send"), micBtn = $("btn-mic"), micLabel = $("mic-label");
  var resetBtn = $("btn-reset"), hintEl = $("hint");
  var badgeEmotion = $("badge-emotion"), badgeState = $("badge-state");
  var meterValence = $("meter-valence"), meterArousal = $("meter-arousal");
  var fallbackEl = $("avatar-fallback"), fallbackFace = $("fallback-face"), fallbackCap = $("fallback-cap");
  var imgA = $("avatar-a"), imgB = $("avatar-b");

  // ---------------- 运行状态 ----------------
  var sessionId = "";
  var busy = false;
  var recorder = null;
  var chunks = [];
  var recordTimer = null;
  var isRecording = false;
  var currentExpression = "";
  var frontLayer = null;      // 当前可见的那层 img
  var currentNode = null;     // 当前播放的 Audio

  // ---------------- 会话 ----------------
  function newId() {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function ensureSession() {
    try {
      sessionId = localStorage.getItem(SESSION_KEY) || "";
      if (!sessionId) {
        sessionId = newId();
        localStorage.setItem(SESSION_KEY, sessionId);
      }
    } catch (e) {
      sessionId = newId();
    }
  }

  // ---------------- 气泡 ----------------
  function scrollBottom() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addRow(kind, text, meta) {
    var row = document.createElement("div");
    row.className = "row " + kind;

    var wrap = document.createElement("div");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (meta) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      wrap.appendChild(m);
    }

    row.appendChild(wrap);
    logEl.appendChild(row);
    scrollBottom();
    return { row: row, bubble: bubble };
  }

  function addTyping() {
    var row = document.createElement("div");
    row.className = "row them";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeEl(el) { if (el && el.parentNode) { el.parentNode.removeChild(el); } }

  // ---------------- 形象 ----------------
  function fillFallback(expr) {
    var info = EMOTION[expr] || EMOTION.neutral;
    fallbackFace.textContent = info.face;
    fallbackCap.textContent = "表情占位 · " + info.cn;
  }

  // 换表情：先换备用层，加载成功再交叉淡入；失败就退回占位块。
  function setExpression(expr) {
    var label = EMOTION[expr] ? expr : "neutral";
    if (label === currentExpression) { return; }
    currentExpression = label;

    var info = EMOTION[label];
    badgeEmotion.textContent = "她的表情 · " + info.cn;
    fallbackEl.style.visibility = "visible";
    fillFallback(label);

    var next = (frontLayer === imgA) ? imgB : imgA;
    var url = "/avatar/expr_" + label + ".webp";

    var done = false;
    function activate() {
      if (done) { return; }
      done = true;
      next.classList.add("active");
      if (frontLayer && frontLayer !== next) { frontLayer.classList.remove("active"); }
      frontLayer = next;
      fallbackEl.style.visibility = "hidden";
    }
    function giveUp() {
      if (done) { return; }
      done = true;
      next.classList.remove("active");
      next.removeAttribute("src");
      // 图没有就老老实实显示占位块 —— 不白屏、不报错
      fallbackEl.style.visibility = "visible";
    }

    next.onload = activate;
    next.onerror = giveUp;
    next.src = url;

    // 已经在缓存里时 onload 可能不触发
    if (next.complete && next.naturalWidth > 0) { activate(); }
  }

  function setStageState(state) {
    stageEl.setAttribute("data-state", state === "speaking" ? "speaking" : "idle");
    badgeState.textContent = STATE_CN[state] || state;
  }

  function setMeters(valence, arousal) {
    // valence: -1 ~ 1  →  0 ~ 100%（负值用冷色）
    var v = Math.max(-1, Math.min(1, Number(valence) || 0));
    meterValence.style.width = (Math.abs(v) * 100) + "%";
    meterValence.classList.toggle("neg", v < 0);

    var a = Math.max(0, Math.min(1, Number(arousal) || 0));
    meterArousal.style.width = (a * 100) + "%";
    meterArousal.classList.remove("neg");
  }

  // ---------------- 语音播放 ----------------
  function stopAudio() {
    if (currentNode) {
      try { currentNode.pause(); } catch (e) { /* 忽略 */ }
      currentNode = null;
    }
  }

  function playAudio(url) {
    if (!url) { setStageState("idle"); return; }
    stopAudio();
    var audio = new Audio(url);
    currentNode = audio;
    setStageState("speaking");
    audio.onended = function () {
      if (currentNode === audio) { currentNode = null; setStageState("idle"); }
    };
    audio.onerror = function () {
      if (currentNode === audio) { currentNode = null; setStageState("idle"); }
      hint("语音文件没加载出来，只显示文字。", true);
    };
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () { setStageState("idle"); });
    }
  }

  function hint(text, warn) {
    hintEl.textContent = text;
    hintEl.className = "hint" + (warn ? " warn" : "");
  }

  // ---------------- 发送 ----------------
  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on;
    inputEl.disabled = on;
    micBtn.disabled = on;
    if (on) { setStageState("thinking"); }
  }

  function buildMeta(data, state) {
    var parts = [];
    if (typeof data.turn === "number") { parts.push("第 " + data.turn + " 轮"); }
    if (typeof data.latency_ms === "number") { parts.push(data.latency_ms + " ms"); }
    if (!data.audio_url) { parts.push("无语音"); }
    if (state === "speaking") { parts.push("正在说"); }
    return parts.join(" · ");
  }

  function send(payload) {
    if (busy) { return; }
    var fd = new FormData();
    fd.append("session_id", sessionId);
    if (payload.audio) {
      fd.append("audio", payload.audio, "recording.webm");
    } else {
      fd.append("text", payload.text);
    }

    setBusy(true);
    hint("她正在想怎么回你……");

    var typing = addTyping();

    // 超时保护：LLM + TTS 串起来最多给 45 秒。演示时卡住不能一直转圈，要能重试。
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 45000);

    fetch(API_CHAT, { method: "POST", body: fd, signal: ctrl.signal })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (body) {
          if (!body) { throw new Error("服务返回了看不懂的东西（HTTP " + res.status + "）"); }
          return body;
        });
      })
      .then(function (data) {
        removeEl(typing);

        // 用户气泡用服务端识别出的文字（录音时这才是"你说了什么"）
        var heard = (data.perception && data.perception.text) || payload.text || "（一段语音）";
        addRow("me", heard, payload.audio ? "语音" : "");

        if (data.error) {
          addRow("them", data.reply_text || "嗯……我这边出了点问题。").bubble.classList.add("err");
          hint(String(data.error), true);
          // 出错也尽量保住形象字段（契约要求 error 里带 avatar）
          if (data.avatar && data.avatar.expression) { setExpression(data.avatar.expression); }
          setStageState("idle");
          return;
        }

        var perception = data.perception || {};
        var response = data.response || {};
        var avatar = data.avatar || {};

        setExpression(avatar.expression || response.target_emotion || "neutral");
        setMeters(perception.valence, perception.arousal);

        var audioUrl = data.audio_url || "";
        if (audioUrl) { playAudio(audioUrl); } else { setStageState("idle"); }

        addRow("them", response.reply_text || "（没拿到回复）", buildMeta(data, avatar.state || ""));
        hint(audioUrl ? "语音已生成，正在播放。" : "这条只显示了文字（TTS 没出声音）。");

        // 请求耗时日志（任务板 D2 晚上的一项）：演示时卡在哪一眼能看出来
        if (typeof data.latency_ms === "number") {
          console.log("[chat] turn=" + data.turn + " latency=" + data.latency_ms + " ms");
        }
      })
      .catch(function (err) {
        removeEl(typing);
        var aborted = !!(err && err.name === "AbortError");
        var row = addRow("them", aborted ? "我这边有点慢，没等到结果。" : "网络好像断了，稍后再试一次？");
        row.bubble.classList.add("err");

        // 失败就给一个「重试」入口，重发同一份内容（不用用户重新打字）
        var again = document.createElement("button");
        again.type = "button";
        again.className = "btn-ghost";
        again.textContent = "重试";
        again.style.marginTop = "6px";
        again.addEventListener("click", function () {
          removeEl(row.row);
          send(payload);
        });
        row.bubble.parentNode.appendChild(again);

        hint(aborted ? "超时了（45 秒没响应），可以点「重试」。"
                     : ("请求失败：" + (err && err.message ? err.message : "未知错误")), true);
        setStageState("idle");
      })
      .then(function () {
        clearTimeout(timer);
        setBusy(false);
        inputEl.focus();
      });
  }

  // ---------------- 录音 ----------------
  function canRecord() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function pickMime() {
    var cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    for (var i = 0; i < cands.length; i++) {
      if (MediaRecorder.isTypeSupported(cands[i])) { return cands[i]; }
    }
    return "";
  }

  function setRecordingUI(on) {
    isRecording = on;
    micBtn.classList.toggle("rec", on);
    micLabel.textContent = on ? "发送这段" : "录音";
    inputEl.disabled = on || busy;
    setStageState(on ? "listening" : "idle");
  }

  function startRecording() {
    if (!canRecord()) {
      hint("这个浏览器不支持录音，用打字吧。", true);
      return;
    }
    var mime = pickMime();

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        chunks = [];
        recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

        recorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) { chunks.push(e.data); }
        };

        recorder.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          var blob = new Blob(chunks, { type: mime || "audio/webm" });
          chunks = [];
          if (blob.size < 1200) {
            hint("这段太短了，说完整一句再点一下。", true);
            return;
          }
          send({ audio: blob });
        };

        recorder.start();
        setRecordingUI(true);
        hint("正在听……说完点一下「发送这段」（最长 30 秒）。");

        recordTimer = setTimeout(function () {
          if (isRecording) { stopRecording(); }
        }, MAX_RECORD_MS);
      })
      .catch(function (err) {
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          hint("麦克风被浏览器拦了，点地址栏的图标允许一下，或者先用打字。", true);
        } else if (name === "NotFoundError") {
          hint("没找到麦克风设备，先用打字吧。", true);
        } else {
          hint("开不了麦克风：" + (err && err.message ? err.message : "未知"), true);
        }
        setRecordingUI(false);
      });
  }

  function stopRecording() {
    if (recordTimer) { clearTimeout(recordTimer); recordTimer = null; }
    if (recorder && recorder.state !== "inactive") {
      try { recorder.stop(); } catch (e) { /* 忽略 */ }
    }
    recorder = null;
    setRecordingUI(false);
  }

  function toggleRecording() {
    if (busy) { return; }
    if (isRecording) { stopRecording(); } else { startRecording(); }
  }

  // ---------------- 健康检查 ----------------
  function setDot(el, ok) {
    if (!el) { return; }
    el.classList.remove("on", "off");
    el.classList.add(ok ? "on" : "off");
  }

  function checkHealth() {
    fetch(API_HEALTH)
      .then(function (r) { return r.json(); })
      .then(function (h) {
        setDot($("dot-asr"), !!h.asr);
        setDot($("dot-tts"), !!h.tts);

        var notes = [];
        if (!h.asr) { notes.push("语音识别没装（可以打字）"); }
        if (!h.tts) { notes.push("语音输出不可用（只有文字）"); }
        if (!h.llm) { notes.push("没配 DEEPSEEK_API_KEY，走的是内置 mock 回复"); }

        if (notes.length) { hint(notes.join("；"), true); }
        else { hint("一切正常。说一句试试。"); }

        if (!h.asr) { micBtn.title = "语音识别未安装，点了也没用，先用打字"; }
      })
      .catch(function () {
        setDot($("dot-asr"), false);
        setDot($("dot-tts"), false);
        hint("连不上后端服务，确认 app.py 还在跑。", true);
      });
  }

  // ---------------- 重置 ----------------
  function resetSession() {
    if (busy) { return; }
    if (!window.confirm("清空这轮对话，重新开始？")) { return; }

    var fd = new FormData();
    fd.append("session_id", sessionId);

    fetch(API_RESET, { method: "POST", body: fd })
      .catch(function () { /* 重置失败也不该卡住界面 */ })
      .then(function () {
        stopAudio();
        logEl.innerHTML = "";
        currentExpression = "";
        setExpression("neutral");
        setStageState("idle");
        setMeters(0, 0.4);
        greeting();
        hint("已经重新开始。");
      });
  }

  // ---------------- 开场 ----------------
  function greeting() {
    addRow("them", "我在呢。今天过得怎么样？", "");
  }

  // ---------------- 绑定 ----------------
  function bind() {
    sendBtn.addEventListener("click", function () {
      var text = inputEl.value.trim();
      if (!text) { inputEl.focus(); return; }
      inputEl.value = "";
      send({ text: text });
    });

    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    micBtn.addEventListener("click", toggleRecording);
    resetBtn.addEventListener("click", resetSession);

    // 页面切走时放掉麦克风，别让录制状态卡住
    window.addEventListener("beforeunload", function () {
      if (isRecording) { stopRecording(); }
    });
  }

  // ---------------- 启动 ----------------
  function init() {
    ensureSession();
    bind();
    setStageState("idle");
    setExpression("neutral");
    setMeters(0, 0.4);
    greeting();
    checkHealth();
    inputEl.focus();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
