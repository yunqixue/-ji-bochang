<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小雨 · 情感陪伴</title>
<!-- 3D 形象（TalkingHead + Three.js，全部本地 vendor，断网可用）。
     加载失败会自动沿用原来的 2D 立绘，页面不受影响。 -->
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/three/addons/"
  }
}
</script>
<!--
  聊天 / 通话页面（C 的产出）。对应 docs/接口契约.md v0.3。

  两个视图：
    · call  通话视图（默认）：全屏立绘 + 自拍小窗 + 控制条 + 字幕
    · chat  文字视图：左右两栏，完整对话记录
    用 ?mode=call / ?mode=text 可直接进对应视图（演示与截图都省事）。

  约束（三天冲刺，别加东西）：
    · 单文件、零依赖、零构建 —— 演示现场断网也能开
    · 不依赖 response.debug / perception.raw（契约 §1 硬规则 6）
    · 形象图缺一张也不能白屏：加载失败一律落到占位块
    · 换表情走 200ms 交叉淡入，不直接改 src（契约 §1）
    · 摄像头只做本地自拍预览，不上传、不送模型
-->
<style>
  :root {
    /* 奶油晨光 */
    --bg: #fbf6ef;
    --bg-warm: #fdeee4;
    --panel: rgba(255, 253, 250, .82);
    --panel-solid: #fffdfa;
    --line: rgba(120, 96, 74, .14);
    --ink: #3b332e;
    --muted: #91847a;
    --accent: #e08a6b;
    --accent-deep: #cf7355;
    --accent-soft: #fbe6da;
    --user-bubble: #edf3f8;
    --danger: #d95757;
    --ok: #5aa06f;
    --radius: 22px;
    --shadow: 0 18px 50px -18px rgba(120, 88, 60, .28);
    --shadow-soft: 0 6px 22px -10px rgba(120, 88, 60, .25);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 520px at 12% -8%, #fdeade 0%, transparent 62%),
      radial-gradient(800px 460px at 92% 4%, #fdf3e2 0%, transparent 58%),
      linear-gradient(180deg, #fdf9f4 0%, var(--bg) 46%, #f8f2e9 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input { font: inherit; }

  /* ============ 通话视图 ============ */
  .view-call {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 10px;
    padding: 16px clamp(14px, 3vw, 34px) 18px;
  }

  .view-call[hidden] { display: none; }

  .call-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 4px;
  }

  .call-id { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

  .call-name { font-size: 17px; font-weight: 650; letter-spacing: .3px; }

  .call-status {
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .call-status::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(90, 160, 111, .16);
  }

  .call-status.ended::before { background: #c2b6aa; box-shadow: 0 0 0 3px rgba(160, 150, 140, .14); }

  .call-timer {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
  }

  .grow { flex: 1; }

  .chip {
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .72);
    color: var(--muted);
    transition: color .16s, border-color .16s, background .16s;
  }

  .chip:hover { color: var(--ink); border-color: rgba(224, 138, 107, .45); }

  .chip.danger { color: #b44b4b; border-color: rgba(180, 75, 75, .28); }
  .chip.danger:hover { background: #fdf0ef; border-color: rgba(180, 75, 75, .5); }

  /* 舞台 */
  .stage {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background:
      radial-gradient(120% 100% at 50% 8%, #fffdf9 0%, #fdf1e5 44%, #f7e7d7 100%);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: var(--shadow);
    display: grid;
    place-items: center;
    min-height: 0;
  }

  /* 舞台上的一层柔和光斑 */
  .stage::before {
    content: "";
    position: absolute;
    inset: -20% -10% auto;
    height: 62%;
    background: radial-gradient(50% 60% at 50% 50%, rgba(255, 226, 205, .75), transparent 70%);
    pointer-events: none;
  }

  .avatar-frame {
    position: relative;
    z-index: 1;
    height: 100%;
    max-height: 100%;
    max-width: 100%;
    aspect-ratio: 3 / 4;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 22px 54px -24px rgba(88, 60, 40, .6);
    animation: breathe 5.5s ease-in-out infinite;
  }

  .stage[data-state="speaking"] .avatar-frame { animation-duration: 2.6s; }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.008); }
  }

  /* 说话时沿画面内缘走一圈暖光 */
  .stage[data-state="speaking"] .avatar-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 3px rgba(224, 138, 107, .5);
    pointer-events: none;
    animation: halo 1.6s ease-out infinite;
  }

  @keyframes halo {
    0%   { opacity: .9; }
    60%  { opacity: .25; }
    100% { opacity: .9; }
  }

  /* 图片是带背景的照片，按「视频画面」铺满并按人脸位置裁切 */
  .avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    opacity: 0;
    transition: opacity 200ms ease-in-out;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 显隐只由父容器的 data-layer 决定：改一个属性就完成交叉淡入，不用逐个元素记状态 */
  .avatar-frame[data-layer="a"] .layer-a,
  .avatar-frame[data-layer="b"] .layer-b { opacity: 1; }

  .avatar-fallback {
    position: relative;
    width: min(60%, 320px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    gap: 4px;
    background: radial-gradient(circle at 50% 34%, #fffefb 0%, #fbeadb 66%, #f4dcc8 100%);
    border: 1px solid rgba(224, 190, 160, .55);
    box-shadow: inset 0 -18px 40px -24px rgba(180, 130, 95, .5);
  }

  .avatar-fallback .face { font-size: 62px; line-height: 1; }

  .avatar-fallback .cap { font-size: 12px; color: #a98d75; letter-spacing: .6px; }

  .stage[data-state="speaking"] .avatar-fallback .face {
    animation: talk 540ms ease-in-out infinite;
  }

  @keyframes talk {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* 自拍小窗 */
  .pip {
    position: absolute;
    right: 16px;
    bottom: 16px;
    z-index: 3;
    width: clamp(110px, 15vw, 168px);
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    overflow: hidden;
    background: #efe6dc;
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 12px 28px -12px rgba(90, 66, 44, .45);
  }

  .pip video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);           /* 自拍镜像，看着自然 */
    display: block;
  }

  .pip[data-on="0"] video { display: none; }

  .pip-off {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 11.5px;
    color: #a08f7f;
    padding: 6px;
  }

  .pip[data-on="1"] .pip-off { display: none; }

  .pip-label {
    position: absolute;
    left: 10px; bottom: 9px;
    font-size: 10.5px;
    color: #fff;
    background: rgba(58, 48, 42, .52);
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .5px;
    pointer-events: none;
  }

  /* 字幕 */
  .subtitle {
    min-height: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 8px;
  }

  .subtitle span {
    max-width: 860px;
    text-align: center;
    font-size: clamp(14px, 1.6vw, 17px);
    line-height: 1.7;
    color: #4a4038;
    text-wrap: pretty;
  }

  .subtitle .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--accent);
    animation: caret 900ms steps(1) infinite;
  }

  @keyframes caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* 控制条 */
  .call-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 4px 0 2px;
  }

  .ctrl {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .8);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-soft);
    font-size: 13.5px;
    color: #5c5049;
    transition: transform .12s, background .16s, color .16s, border-color .16s;
  }

  .ctrl:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(224, 138, 107, .45); }
  .ctrl:disabled { opacity: .45; cursor: not-allowed; }

  .ctrl .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c9bcb0;
  }

  .ctrl.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .ctrl.on .dot { background: #fff; }

  .ctrl.rec { background: var(--danger); border-color: var(--danger); color: #fff; }
  .ctrl.rec .dot { animation: blink 900ms infinite; }

  @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  .ctrl.round { width: 48px; height: 48px; padding: 0; justify-content: center; border-radius: 50%; }

  /* 通话里的打字条 */
  .call-input {
    display: flex;
    gap: 8px;
    align-items: center;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .call-input input {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .86);
    outline: none;
    color: var(--ink);
    transition: border-color .16s, box-shadow .16s;
  }

  .call-input input:focus {
    border-color: rgba(224, 138, 107, .55);
    box-shadow: 0 0 0 4px rgba(224, 138, 107, .12);
  }

  .call-input input:disabled { background: rgba(246, 240, 233, .9); }

  .send-btn {
    padding: 12px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 10px 22px -12px rgba(207, 115, 85, .9);
    transition: background .16s, transform .12s;
  }

  .send-btn:hover:not(:disabled) { background: var(--accent-deep); }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ============ 文字视图 ============ */
  .view-chat {
    height: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px clamp(14px, 3vw, 24px) 20px;
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 14px;
  }

  .view-chat[hidden] { display: none; }

  .chat-top {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  .brand .sub { font-size: 12px; color: var(--muted); }

  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .8);
    white-space: nowrap;
  }

  .pill i { width: 6px; height: 6px; border-radius: 50%; background: #c9bcb0; }
  .pill.on i { background: var(--ok); }
  .pill.off i { background: var(--danger); }

  .stage-card {
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    backdrop-filter: blur(8px);
  }

  .stage-card .stage { flex: 1; min-height: 0; box-shadow: none; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #8a5c3f;
    border: 1px solid rgba(224, 160, 125, .3);
  }

  .badge.state { background: rgba(238, 245, 240, .9); color: #47705a; border-color: rgba(120, 170, 140, .3); }

  .meters { display: grid; gap: 7px; font-size: 12px; color: var(--muted); }

  .meter { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 10px; }

  .meter .track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(206, 186, 166, .35);
    overflow: hidden;
  }

  .meter .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #f0b795, var(--accent));
    transition: width .32s ease;
  }

  .meter .fill.neg { background: linear-gradient(90deg, #a8c2dd, #7d9cc0); }

  .hint { font-size: 12px; color: var(--muted); min-height: 18px; }
  .hint.warn { color: #a8763f; }

  .chat-card {
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .row { display: flex; gap: 8px; max-width: 86%; }
  .row.me { margin-left: auto; flex-direction: row-reverse; }

  .bubble {
    padding: 10px 14px;
    border-radius: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.7;
    border: 1px solid var(--line);
    background: #fff;
  }

  .row.them .bubble { border-top-left-radius: 5px; }
  .row.me .bubble { border-top-right-radius: 5px; background: var(--user-bubble); border-color: #dae6f0; }

  .bubble.err { border-color: #f0cfd0; background: #fdf4f4; color: #8c4040; font-size: 13.5px; }

  .meta { font-size: 11.5px; color: #b0a396; margin-top: 4px; padding: 0 4px; }
  .row.me .meta { text-align: right; }

  /* 聊天气泡头像（dsh-chat-avatar 的等价实现） */
  .avatar-chip {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .7);
  }
  .avatar-chip img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .avatar-chip.you {
    display: grid; place-items: center;
    font-size: 12px; color: #fff;
    background: linear-gradient(135deg, #a9b7c6, #7e93a8);
  }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: #cbbfb2; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }

  .composer {
    border-top: 1px solid var(--line);
    padding: 12px 14px 14px;
    background: rgba(255, 253, 250, .9);
  }

  .composer .line { display: flex; gap: 10px; align-items: center; }

  .composer input {
    flex: 1;
    min-width: 0;
    padding: 11px 15px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: #fff;
    outline: none;
    color: var(--ink);
    transition: border-color .16s, box-shadow .16s;
  }

  .composer input:focus { border-color: rgba(224, 138, 107, .55); box-shadow: 0 0 0 3px rgba(224, 138, 107, .12); }
  .composer input:disabled { background: #f7f2ec; }

  .btn-ghost {
    padding: 11px 16px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    transition: color .16s, border-color .16s;
  }

  .btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: rgba(224, 138, 107, .45); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 860px) {
    .view-chat { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
    .stage-card { order: 3; }
    .chat-card { order: 2; }
    .stage-card .stage { min-height: 200px; }
    .view-call { padding: 12px 12px 14px; gap: 8px; }
  }
  /* ============ 赛博朋克主题（html[data-theme="cyber"]）============
     只覆盖颜色变量 + 少数硬编码背景，默认主题完全不受影响。 */
  html[data-theme="cyber"] {
    --bg: #05070e;
    --panel: rgba(11, 17, 29, .78);
    --line: rgba(0, 229, 255, .22);
    --ink: #d9f6ff;
    --muted: #7ea3b8;
    --accent: #00e5ff;
    --accent-deep: #00b3cc;
    --accent-soft: rgba(0, 229, 255, .10);
    --user-bubble: rgba(255, 0, 128, .14);
    --danger: #ff4d6d;
    --ok: #22e6a0;
    --shadow: 0 20px 60px -24px rgba(0, 229, 255, .35);
    --shadow-soft: 0 8px 26px -12px rgba(0, 229, 255, .28);
  }

  html[data-theme="cyber"] body {
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(0, 229, 255, .12), transparent 62%),
      radial-gradient(820px 480px at 94% 2%, rgba(255, 0, 128, .10), transparent 58%),
      linear-gradient(180deg, #070b15 0%, #04060c 58%, #05080f 100%);
  }

  /* 网格线 */
  html[data-theme="cyber"] body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, .055) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  }

  html[data-theme="cyber"] .app,
  html[data-theme="cyber"] .view-call,
  html[data-theme="cyber"] .view-chat { position: relative; z-index: 1; }

  html[data-theme="cyber"] .stage {
    background: radial-gradient(120% 100% at 50% 8%, #0a1424 0%, #070c18 46%, #04070e 100%);
    border-color: rgba(0, 229, 255, .22);
    box-shadow: 0 0 0 1px rgba(0, 229, 255, .10), 0 26px 70px -30px rgba(0, 229, 255, .5);
  }

  html[data-theme="cyber"] .stage::before {
    background: radial-gradient(50% 60% at 50% 50%, rgba(0, 229, 255, .16), transparent 70%);
  }

  /* 人物照片压一点冷调，别和霓虹打架 */
  html[data-theme="cyber"] .avatar-img { filter: saturate(1.06) contrast(1.05) brightness(.96); }

  html[data-theme="cyber"] .avatar-frame { box-shadow: 0 0 0 1px rgba(0, 229, 255, .35), 0 0 34px -6px rgba(0, 229, 255, .55); }

  html[data-theme="cyber"] .avatar-fallback {
    background: radial-gradient(circle at 50% 34%, #0d1a2c 0%, #0a1220 66%, #060a12 100%);
    border-color: rgba(0, 229, 255, .35);
  }
  html[data-theme="cyber"] .avatar-fallback .cap { color: #5f93ab; }

  html[data-theme="cyber"] .pip { background: #0a1220; border-color: rgba(0, 229, 255, .3); }
  html[data-theme="cyber"] .pip-off { color: #5f93ab; }

  html[data-theme="cyber"] .chip,

  .stage[data-state="speaking"] .avatar-frame { animation: floaty 2.4s ease-in-out infinite; }

  /* ==================================================================
     视觉增强层（B，2026-10-24）
     解决三个"看着单薄"的问题：
       ① 通话视图左右大片空白  → 用同一张图放大模糊当背景（像视频通话的背景虚化）
       ② 形象是死图片          → 说话时按真实音量做细微推近，换表情时闪一下柔光
       ③ 空聊天区什么都没有    → 加欢迎卡 + 三个一键话题
     做法：只加新类名和 CSS 变量 --voice，不改任何已有类的含义。
     出问题可以直接删掉这一段，页面会回到原来的样子。
     ================================================================== */

  :root { --voice: 0; }

  /* --- ① 舞台背景虚化：把空的地方填满 --- */
  .stage-bg {
    position: absolute;
    inset: -14%;
    z-index: 0;
    pointer-events: none;
    opacity: .82;
    filter: blur(18px) saturate(1.35) brightness(.9);
    transform: scale(1.08);
    /* 切主题时不跳变：模糊/亮度平滑过渡，避免"背景被拉远"的错觉 */
    transition: filter 420ms ease, opacity 420ms ease;
  }
  .stage-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    display: block;
    /* 动态背景：极慢的推近 + 轻微漂移，像镜头在呼吸 */
    animation: bgKenBurns 42s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes bgKenBurns {
    from { transform: scale(1) translate3d(0, 0, 0); }
    to   { transform: scale(1.09) translate3d(-1.6%, -1.2%, 0); }
  }
  /* 边缘压暗，把视线收回到中间的人身上（只作用在背景上，不盖脸） */
  .stage-tint {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(115% 80% at 50% 42%, transparent 52%, rgba(0, 0, 0, .34) 100%);
  }
  /* ★ 背景（舞台虚化层 + 边缘压暗）不随主题变化：主题只管 UI 配色，背景属于内容。
     原来每个主题给了不同的 brightness/saturate，深色主题还额外叠了霓虹光，
     一切换光感背景就跟着变 —— 看起来像"换了张背景"。现在统一成一套参数。 */
  .stage-bg { opacity: .78; filter: blur(20px) saturate(1.18) brightness(.95); }
  .stage-tint {
    background: radial-gradient(115% 80% at 50% 42%, transparent 54%, rgba(0, 0, 0, .26) 100%);
  }
  /* 背景下方压暗，让画面自然过渡到字幕区，不要一刀切 */
  .stage-tint::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34%;
    background: linear-gradient(to top, rgba(0, 0, 0, .34), transparent);
  }

  /* --- ② 形象动效：一条 transform 同时管两件事 ---
     · 随声音推近：--voice（JS 按 mp3 实时音量写入）
     · 目光跟随：--gx / --gy（C 加的，鼠标在舞台里移动时写入，-0.5 ~ +0.5）
     ★ 必须写在同一条 transform 里：transform 是覆盖型属性，分开写后面那条会把前面那条顶掉。
     实测过一次：两条分开写时，鼠标停在舞台上（--gx 有值）"随声音推近"就整个失效了。 */
  .avatar-img {
    transform:
      scale(calc(1 + var(--voice, 0) * 0.035))
      translate(calc(var(--gx, 0) * 5px), calc(var(--gy, 0) * 4px));
    transition: opacity 200ms ease-in-out, transform 140ms ease-out;
  }

  /* 换表情时闪一下柔光，让"换脸"看起来是主动的表情变化，不是图片换了。
     刻意只覆盖人物画面本身（放在 .avatar-frame 里），不闪整个舞台。 */
  .stage-flash {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    border-radius: inherit;
    background: radial-gradient(58% 46% at 50% 34%, rgba(255, 238, 220, .5), transparent 72%);
  }
  .stage-flash.fire { animation: exprFlash 520ms ease-out; }

  @keyframes exprFlash {
    0%   { opacity: 0; }
    22%  { opacity: .5; }
    100% { opacity: 0; }
  }

  /* --- 声音波形：只在说话时亮起来，高度跟着 --voice 走 --- */
  .voice-wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 24px;
    margin: 0 0 4px;
    color: #7fd4ff;
    opacity: 0;
    transition: opacity 260ms ease;
  }
  .voice-wave.on { opacity: 1; }
  .voice-wave i {
    display: block;
    width: 3px;
    border-radius: 3px;
    background: currentColor;
    height: calc(5px + var(--voice, 0) * 20px * var(--k, 1));
    transition: height 90ms linear;
  }
  .voice-wave i:nth-child(1) { --k: .40; }
  .voice-wave i:nth-child(2) { --k: .68; }
  .voice-wave i:nth-child(3) { --k: .95; }
  .voice-wave i:nth-child(4) { --k: .74; }
  .voice-wave i:nth-child(5) { --k: 1.00; }
  .voice-wave i:nth-child(6) { --k: .80; }
  .voice-wave i:nth-child(7) { --k: .55; }
  .voice-wave i:nth-child(8) { --k: .88; }
  .voice-wave i:nth-child(9) { --k: .45; }
  html[data-theme="sweet"] .voice-wave,
  html[data-theme="cream"] .voice-wave { color: #d9876a; }
  html[data-theme="nature"] .voice-wave { color: #6aa97b; }
  html[data-theme="night"] .voice-wave { color: #b39dff; }

  /* --- ③ 空聊天区的欢迎卡 --- */
  .chat-card { position: relative; }
  .welcome {
    position: absolute;
    left: 0;
    right: 0;
    top: 76px;
    bottom: 74px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
    pointer-events: none;
    transition: opacity 320ms ease;
  }
  .welcome.hide { opacity: 0; visibility: hidden; }
  .welcome .w-hi { font-size: 15.5px; letter-spacing: .4px; }
  .welcome .w-sub { font-size: 12.5px; opacity: .58; }
  .welcome .w-tips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 480px;
    margin-top: 8px;
    pointer-events: auto;
  }
  .welcome .w-tips button {
    font: inherit;
    font-size: 12.5px;
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: 1px solid currentColor;
    opacity: .6;
    transition: opacity 180ms ease, transform 180ms ease;
  }
  .welcome .w-tips button:hover { opacity: 1; transform: translateY(-1px); }
  .welcome .w-tips button:disabled { cursor: default; opacity: .3; }

  /* 目光跟随：立绘朝鼠标方向轻微平移，像在看着对方。
     ★ 这里只声明变量默认值；平移与"随声音推近"合在上面那一条 .avatar-img 的 transform 里 ——
       单独再写一条 .stage:hover .avatar-img{transform:...} 会把 --voice 的推近整条顶掉（实测发生过）。 */
  .stage { --gx: 0; --gy: 0; }

  /* ===== 真背景场景（bg_*.webp）：整页铺满，而不是人物框后面糊一块 =====
     用户反馈："我要的是整个页面换成那个场景，不是人物框里一堆黑黑的"。
     所以场景模式下：
       · body 直接铺场景图（固定不滚动，cover 铺满整个视口）
       · .stage 面板变透明（去掉深色底、边框、阴影），场景从人物框外面一直连到里面
       · .stage-bg 那条局部虚化层直接隐藏（不再需要）
       · 全局压一层暗色渐变，保证顶部按钮和底部字幕在亮背景上也读得清
     「自动」模式（还没选场景）完全不受影响，还是原来那套跟着表情虚化。 */
  html[data-scene="1"] body {
    background-image: var(--scene-img, none) !important;
    background-size: cover;
    background-position: 50% 42%;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  html[data-scene="1"] body::before {      /* 盖掉赛博主题的网格线，场景上不要再叠网格 */
    opacity: .18;
  }
  /* 场景图上的统一压暗：所有主题用同一套，切光感时背景不再跟着明暗跳。
     配套：场景模式下文字统一转浅色（见文件末尾），靠文字阴影保证可读，
     而不是靠压暗整页。 */
  html[data-scene="1"] body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(10, 8, 16, .34) 0%, rgba(10, 8, 16, .06) 22%,
                      rgba(10, 8, 16, .05) 58%, rgba(10, 8, 16, .38) 100%);
  }
  /* ★ 这里的 !important 是必需的：各主题都有自己的 `html[data-theme="x"] .stage { background: … }`，
     选择器权重和 `html[data-scene="1"] .stage` 一样，谁写在后面谁赢。C 后来新增的 light/ease 主题
     就写在后面，结果整块白底把场景图盖住了（实测截图里中央一大片发白）。 */
  html[data-scene="1"] .stage {
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }
  /* 舞台外面那层面板（.stage-card）也有深色底和描边，场景模式下一起透掉，
     否则整页背景会被它压暗、四周还留一圈圆角深色边框 */
  html[data-scene="1"] .stage-card {
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }
  html[data-scene="1"] .view-call,
  html[data-scene="1"] .view-chat { background: transparent !important; }
  html[data-scene="1"] .stage::before { opacity: 0 !important; }   /* 主题里那团顶部暖光 */
  html[data-scene="1"] .stage-bg { display: none !important; }     /* 局部虚化层隐藏 */
  html[data-scene="1"] .stage-tint {
    background: radial-gradient(120% 88% at 50% 44%, transparent 62%, rgba(0, 0, 0, .38) 100%);
  }
  /* 人物画面卡在场景上要立得住：加一圈薄边和投影 */
  html[data-scene="1"] .avatar-frame {
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .16);
  }

  /* ============ 3D 形象挂载点 ============
     3D 就绪后给 .stage 打 data-avatar3d="1"：显示 3D 画布、藏掉 2D 立绘。
     初始化失败则永远不打这个属性，页面保持 2D 原样。 */
  .avatar3d-mount {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: none;
  }
  .stage[data-avatar3d="1"] .avatar3d-mount { display: block; }
  .stage[data-avatar3d="1"] .avatar-frame { visibility: hidden; }
  .avatar3d-mount .avatar3d-canvas,
  .avatar3d-mount canvas { width: 100%; height: 100%; display: block; }

  /* ============ 主题：正常光（干净清爽的浅色，对比度正常）============ */
  html[data-theme="light"] {
    --bg: #f6f8fa;
    --panel: rgba(255, 255, 255, .92);
    --line: rgba(110, 130, 150, .18);
    --ink: #2b333b;
    --muted: #6f7c89;
    --accent: #2f8f9d;
    --accent-deep: #257582;
    --accent-soft: #e4f1f3;
    --user-bubble: #eef3f7;
    --danger: #d9534f;
    --ok: #3f9d5f;
    --shadow: 0 16px 44px -20px rgba(60, 80, 100, .28);
    --shadow-soft: 0 6px 20px -12px rgba(60, 80, 100, .24);
  }
  html[data-theme="light"] body {
    background:
      radial-gradient(900px 520px at 12% -8%, #eef4f8 0%, transparent 62%),
      radial-gradient(820px 480px at 92% 4%, #f7f4ee 0%, transparent 58%),
      linear-gradient(180deg, #fbfcfd 0%, #f5f8fa 50%, #eef3f6 100%);
  }
  html[data-theme="light"] .stage {
    background: radial-gradient(120% 100% at 50% 8%, #ffffff 0%, #f4f8fa 46%, #e9f0f4 100%);
  }
  html[data-theme="light"] .avatar-fallback {
    background: radial-gradient(circle at 50% 34%, #ffffff 0%, #eef4f8 66%, #e2ebf1 100%);
    border-color: rgba(160, 185, 200, .5);
  }

  /* ============ 主题：护眼（暖纸底、低对比、低蓝光）============ */
  html[data-theme="ease"] {
    --bg: #f3ecdf;
    --panel: rgba(250, 245, 235, .94);
    --line: rgba(150, 128, 96, .22);
    --ink: #3b352c;
    --muted: #827665;
    --accent: #a8763f;
    --accent-deep: #8e6231;
    --accent-soft: #eee3d1;
    --user-bubble: #e9e0cf;
    --danger: #b5564c;
    --ok: #5f8a5a;
    --shadow: 0 16px 44px -20px rgba(120, 96, 64, .26);
    --shadow-soft: 0 6px 20px -12px rgba(120, 96, 64, .22);
  }
  html[data-theme="ease"] body {
    background:
      radial-gradient(900px 520px at 12% -8%, #f7efdf 0%, transparent 62%),
      radial-gradient(820px 480px at 92% 4%, #f2ead9 0%, transparent 58%),
      linear-gradient(180deg, #f8f2e6 0%, #f3ecdf 48%, #ece3d3 100%);
  }
  html[data-theme="ease"] .stage {
    background: radial-gradient(120% 100% at 50% 8%, #fdf8ee 0%, #f5ecdc 46%, #eee3d0 100%);
  }
  html[data-theme="ease"] .avatar-fallback {
    background: radial-gradient(circle at 50% 34%, #fefaf1 0%, #f3e9d7 66%, #e9dcc5 100%);
    border-color: rgba(190, 165, 130, .5);
  }
  /* 护眼模式：降低对比与亮度刺激 */
  html[data-theme="ease"] .bubble { background: #fbf6ec; border-color: rgba(150, 128, 96, .2); }
  html[data-theme="ease"] input { background: #fbf7ee; }
  html[data-theme="ease"] .subtitle span { color: #4a4237; }
  /* ===== 桌面小人浮层（B 追加，v2）=====
     ① 气泡做成"思考气泡"：椭圆圆角 + 深蓝描边 + 三个由大到小的圆点尾巴（照用户给的参考图）
     ② 眨眼：换真实的闭眼立绘
     ③ 说话：在 q_<表情> 与 q_talk（张嘴）之间快速交替，像在讲话
     ④ 待机随机小动作：蹦一下 / 摇摆 / 歪头 / 左右挪 / 鼓起
     ⑤ 水印已从素材层面清掉（抠图时只保留最大连通域，"AI 生成"那串字与贴纸不相连，会被整体丢弃） */
  .pet-layer {
    position: fixed;
    right: 200px;   /* 让开右下角的"摄像头未开"小窗 */
    /* ★ 留出底部输入框的高度：小人会吃点击，压在"发送"按钮上就点不到了（实测发现） */
    bottom: 152px;
    z-index: 60;
    width: 128px;
    pointer-events: none;
  }
  .pet-layer[hidden] { display: none; }
  html[data-pet="0"] .pet-layer { display: none; }
  .pet-body {
    position: relative;
    width: 100%;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 10px 18px rgba(20, 30, 45, .32));
    transform-origin: 50% 100%;
    animation: petBreathe 4.2s ease-in-out infinite;
    transition: transform 140ms ease-out;
    touch-action: none;
  }
  .pet-body:hover { transform: scale(1.04); }
  .pet-body img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }

  @keyframes petBreathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.015) translateY(-2px); }
  }
  /* 待机小动作：写成"一次性"动画，由 JS 加类触发、动画结束再摘掉 */
  .pet-body.act-hop   { animation: petHop 560ms cubic-bezier(.3,.9,.3,1); }
  .pet-body.act-sway  { animation: petSway 1400ms ease-in-out; }
  .pet-body.act-lean  { animation: petLean 1200ms ease-in-out; }
  .pet-body.act-slide { animation: petSlide 1800ms ease-in-out; }
  .pet-body.act-pulse { animation: petPulse 900ms ease-in-out; }
  .pet-body.act-shake { animation: petShake 700ms ease-in-out; }
  @keyframes petHop {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-22px) scale(1.05, .96); }
    55% { transform: translateY(0) scale(.97, 1.04); }
    75% { transform: translateY(-6px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes petSway {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    60% { transform: rotate(4deg); }
  }
  @keyframes petLean {
    0%, 100% { transform: rotate(0) translateX(0); }
    35% { transform: rotate(-6deg) translateX(-4px); }
    70% { transform: rotate(-2deg) translateX(2px); }
  }
  @keyframes petSlide {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-26px); }
    65% { transform: translateX(14px); }
  }
  @keyframes petPulse {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.09); }
  }
  @keyframes petShake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(3deg); }
    40% { transform: rotate(-3deg); }
    60% { transform: rotate(2deg); }
    80% { transform: rotate(-2deg); }
  }

  /* 摸头：点下去时头被按住、整个身体被压扁下沉，松手后弹起略微超过原高度再回稳。
     transform-origin 在底部，所以"缩"是从头往下压，而不是整体缩放。 */
  .pet-body.act-pat { animation: petPat 780ms cubic-bezier(.22,.9,.3,1); }
  @keyframes petPat {
    0%   { transform: scale(1, 1) translateY(0); }
    14%  { transform: scale(1.10, .80) translateY(18px); }
    32%  { transform: scale(.94, 1.09) translateY(-11px); }
    50%  { transform: scale(1.04, .97) translateY(3px); }
    68%  { transform: scale(.99, 1.02) translateY(-3px); }
    84%  { transform: scale(1.01, .995) translateY(1px); }
    100% { transform: scale(1, 1) translateY(0); }
  }
  /* 摸头时头顶冒一个小爱心 */
  .pet-heart {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translate(-50%, 0) scale(.6);
    font-size: 26px;
    color: #ff6b8a;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(255, 107, 138, .45);
  }
  .pet-heart.on { animation: petHeart 880ms ease-out; }
  @keyframes petHeart {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.5); }
    25%  { opacity: 1; transform: translate(-50%, -6px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(.9); }
  }

  /* ---- 思考气泡（照参考图：白底 + 深蓝描边 + 三点尾巴）---- */
  .pet-bubble {
    position: absolute;
    right: 4px;
    bottom: calc(100% + 26px);
    max-width: 250px;
    padding: 12px 18px;
    border-radius: 22px / 24px;
    background: #fffdf8;
    color: #1f3a5f;
    font-size: 13.5px;
    line-height: 1.6;
    font-weight: 600;
    text-align: center;
    border: 2.5px solid #24466f;
    box-shadow: 0 10px 24px -12px rgba(20, 40, 70, .45);
    opacity: 0;
    transform: translateY(6px) scale(.96);
    transform-origin: 90% 100%;
    transition: opacity 200ms ease, transform 220ms cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none;
    white-space: pre-wrap;
  }
  .pet-bubble.on { opacity: 1; transform: translateY(0) scale(1); }
  /* 三点尾巴：从大到小朝小人头顶方向排下去 */
  .pet-bubble i {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: #fffdf8;
    border: 2.5px solid #24466f;
  }
  .pet-bubble i.t1 { width: 13px; height: 11px; right: 16px; bottom: -12px; }
  .pet-bubble i.t2 { width: 8px;  height: 7px;  right: 8px;  bottom: -24px; }
  .pet-bubble i.t3 { width: 5px;  height: 4px;  right: 4px;  bottom: -33px; }

  .pet-close {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 20px;
    height: 20px;
    line-height: 17px;
    border-radius: 50%;
    font-size: 13px;
    color: #667;
    background: rgba(255, 255, 255, .92);
    border: 1px solid rgba(120, 140, 160, .4);
    pointer-events: auto;
    opacity: 0;
    transition: opacity 160ms ease;
  }
  .pet-layer:hover .pet-close { opacity: 1; }
  @media (max-width: 720px) {
    .pet-layer { width: 108px; right: 8px; bottom: 82px; }
    .pet-bubble { max-width: 180px; font-size: 12px; padding: 9px 13px; border-width: 2px; }
    .pet-bubble i { border-width: 2px; }
  }

  /* ============ 动态背景：整页场景模式下的缓慢漂移 ============ */
  @keyframes sceneDrift {
    0%   { background-position: 50% 42%; }
    50%  { background-position: 54.5% 46%; }
    100% { background-position: 50% 42%; }
  }
  html[data-scene="1"] body {
    animation: sceneDrift 48s ease-in-out infinite;
  }
  /* 关掉动效偏好时不动 */
  @media (prefers-reduced-motion: reduce) {
    .stage-bg img { animation: none; }
    html[data-scene="1"] body { animation: none; }
  }

  /* 场景模式：文字统一转浅色 + 阴影 —— 这样不靠压暗整页也能读清，
     而且切光感时背景的明暗不再跳。 */
  html[data-scene="1"] .call-name,
  html[data-scene="1"] .call-status,
  html[data-scene="1"] .call-timer,
  html[data-scene="1"] .brand h1,
  html[data-scene="1"] .brand .sub,
  html[data-scene="1"] .subtitle span,
  html[data-scene="1"] .hint {
    color: #f8f6f2;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .62);
  }
  html[data-scene="1"] .chip {
    color: #f8f6f2;
    border-color: rgba(255, 255, 255, .34);
    background: rgba(22, 18, 28, .42);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
  }

  /* （已撤掉「说话时插入视频片段」：硬切真人视频与 2D 立绘风格割裂，观感诡异。
     现在说话态仍由「伪口型」承担：有 expr_<表情>_talk.webp 就换张嘴图，没有就静态图。） */

  /* ★ 放在所有主题之后：场景模式的铺法必须固定。
     各主题的 `background: …` 简写会把 size/repeat/attachment 一并重置成默认值，
     导致场景图从「铺满」退回「原始大小、平铺」——看起来就是背景位置/画面变了。
     这里在最后统一钉住（动画仍会接管 position 做缓慢漂移）。 */
  html[data-scene="1"] body {
    background-size: cover;
    background-position: 50% 42%;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
</style>
</head>
