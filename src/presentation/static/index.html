<!-- ===================== 桌面小人浮层（B 2026-10-25 追加）=====================
     一打开页面就出现在右下角，独立于两个视图，不影响原有布局与交互。
     素材：assets/pet/q_*.webp（Q 版同一角色的 5 个表情，由 experiments/gen_pet_assets.py 生成）
     行为：呼吸 → 随机眨眼 → 跟随智能体表情变脸 → 点她弹跳并说一句 → 可拖动。
     ★ 想彻底关掉：给 <html> 加 data-pet="0"，或点她旁边的 ×。 -->
<div class="pet-layer" id="pet-layer" aria-hidden="true">
  <div class="pet-bubble" id="pet-bubble"><span id="pet-bubble-text"></span><i class="t1"></i><i class="t2"></i><i class="t3"></i></div>
  <div class="pet-body" id="pet-body" title="点我一下">
    <img id="pet-img" alt="" draggable="false">
    <span class="pet-heart" id="pet-heart">♥</span>
  </div>
  <button class="pet-close" id="pet-close" type="button" title="收起小人">×</button>
</div>

<script>
(function () {
  "use strict";

  // ---------------- 常量 ----------------
  var API_CHAT = "/api/chat";
  var API_RESET = "/api/reset";
  var API_HEALTH = "/api/health";
  var SESSION_KEY = "emotion_agent_session_id";
  var MODE_KEY = "emotion_agent_view";
  var MAX_RECORD_MS = 30000;
  var REQUEST_TIMEOUT_MS = 45000;

  // 契约 §4：三层 + 形象同一套标签。前端只做展示，不判断情绪。
  var EMOTION = {
    neutral:   { cn: "平静", face: "🙂" },
    happy:     { cn: "开心", face: "😊" },
    sad:       { cn: "难过", face: "😢" },
    anxious:   { cn: "紧张", face: "😰" },
    angry:     { cn: "生气", face: "😠" },
    surprised: { cn: "惊讶", face: "😮" },
    empathic:  { cn: "关切", face: "🥺" }
  };

  var STATE_CN = { idle: "待机", thinking: "在想", speaking: "说话中", listening: "在听" };

  function $(id) { return document.getElementById(id); }

  // 3D 形象桥（页面底部的 module 脚本初始化成功后挂上 window.avatar3d）。
  // 没就绪时所有调用都是空操作，页面行为和原来 2D 立绘完全一致。
  function th3d() { return window.avatar3d || null; }

  var THEME_KEY = "emotion_agent_theme";
  var THEMES = ["light", "ease", "sweet", "cream", "cyber", "nature", "night"];

  function setTheme(name, remember) {
    var t = (THEMES.indexOf(name) >= 0) ? name : "cream";
    document.documentElement.setAttribute("data-theme", t);
    ["theme-sel", "theme-sel2"].forEach(function (id) {
      var s = $(id);
      if (s) { s.value = t; }
    });
    if (remember !== false) {
      try { localStorage.setItem(THEME_KEY, t); } catch (e) { }
    }
  }

  function initialTheme() {
    var q = (location.search.match(/[?&]theme=([a-z]+)/) || [])[1];
    if (q && THEMES.indexOf(q) >= 0) { return q; }
    try {
      var saved = localStorage.getItem(THEME_KEY);
      if (saved && THEMES.indexOf(saved) >= 0) { return saved; }
    } catch (e) { }
    return "light";          // 默认正常光；想护眼就切「护眼」
  }

  // ---------------- 视图切换 ----------------
  var currentView = "call";
  var viewCall = $("view-call");
  var viewChat = $("view-chat");

  function setView(name) {
    currentView = (name === "chat") ? "chat" : "call";
    viewCall.hidden = currentView !== "call";
    viewChat.hidden = currentView !== "chat";
    try { localStorage.setItem(MODE_KEY, currentView); } catch (e) { }
    if (currentView === "chat") { scrollBottom(); }
    if (currentView === "call" && !asrReady) { /* 通话里仍可打字，不拦 */ }
    var t = th3d();
    if (t) { t.attach(currentView); }   // 3D 画布搬到当前视图的舞台里
  }

  function initialView() {
    var q = (location.search.match(/[?&]mode=(call|text|chat)\b/) || [])[1];
    if (q === "text" || q === "chat") { return "chat"; }
    if (q === "call") { return "call"; }
    try {
      var saved = localStorage.getItem(MODE_KEY);
      if (saved === "chat") { return "chat"; }
    } catch (e) { }
    return "call";
  }

  // ---------------- 元素 ----------------
  var logEl = $("log");
  var subtitleEl = $("subtitle-text");
  var stageEl = $("stage");
  var stageEl2 = $("stage2");
  var chatInput = $("chat-text");
  var chatSend = $("chat-send");
  var chatMic = $("chat-mic");
  var callInput = $("call-text");
  var callSend = $("call-send");
  var cameraBtn = $("btn-camera");
  var cameraLabel = $("camera-label");
  var talkingBtn = $("btn-talking");
  var talkingLabel = $("talking-label");
  var callStatus = $("call-status");
  var callTimerEl = $("call-timer");
  var pipEl = $("pip");
  var selfVideo = $("self-video");
  var pipOffEl = $("pip-off");
  var badgeEmotion = $("badge-emotion");
  var badgeState = $("badge-state");
  var meterValence = $("meter-valence");
  var meterArousal = $("meter-arousal");
  var hintEl = $("hint");

  // 两套形象层（通话视图 / 文字视图各一套，互不干扰）
  var layers = {
    call: { a: $("avatar-a"), b: $("avatar-b"), fallback: $("avatar-fallback"), face: $("fallback-face"), cap: $("fallback-cap"), bg: $("bg-call"), flash: $("flash-call"), show: "b", ok: false, expr: "", token: 0 },
    chat: { a: $("avatar-c"), b: $("avatar-d"), fallback: $("avatar-fallback2"), face: $("fallback-face2"), cap: $("fallback-cap2"), bg: $("bg-chat"), flash: $("flash-chat"), show: "b", ok: false, expr: "", token: 0 }
  };

  // ---------------- 运行状态 ----------------
  var sessionId = "";
  var busy = false;
  var asrReady = true;
  var recorder = null;
  var chunks = [];
  var recordTimer = null;
  var isRecording = false;
  var currentNode = null;
  var cameraStream = null;
  var cameraOn = false;
  var callStartedAt = Date.now();
  var timerHandle = null;
  var typeHandle = null;
  var speaking = false;
  var talkKnown = {};        // 表情 → 是否存在 expr_<表情>_talk.webp（探到一次就记住）

  // ---------------- 会话 ----------------
  function newId() {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function ensureSession() {
    try {
      sessionId = localStorage.getItem(SESSION_KEY) || "";
      if (!sessionId) {
        sessionId = newId();
        localStorage.setItem(SESSION_KEY, sessionId);
      }
    } catch (e) {
      sessionId = newId();
    }
  }

  // ---------------- 气泡（文字视图） ----------------
  function scrollBottom() {
    if (logEl) { logEl.scrollTop = logEl.scrollHeight; }
  }

  function addRow(kind, text, meta) {
    var row = document.createElement("div");
    row.className = "row " + kind;

    // 头像：她这一侧用当前表情图，我这侧用「你」
    var chip = document.createElement("div");
    chip.className = "avatar-chip" + (kind === "me" ? " you" : "");
    if (kind === "me") {
      chip.textContent = "你";
    } else {
      var avatar = document.createElement("img");
      avatar.alt = "";
      var label = (layers.chat && layers.chat.expr) || "neutral";
      avatar.src = "/avatar/expr_" + label + ".webp";
      avatar.onerror = function () { avatar.style.display = "none"; chip.textContent = "她"; };
      chip.appendChild(avatar);
    }
    row.appendChild(chip);

    var wrap = document.createElement("div");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (meta) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      wrap.appendChild(m);
    }

    row.appendChild(wrap);
    logEl.appendChild(row);
    scrollBottom();
    return { row: row, bubble: bubble };
  }

  function addTyping() {
    var row = document.createElement("div");
    row.className = "row them";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeEl(el) { if (el && el.parentNode) { el.parentNode.removeChild(el); } }

  // ---------------- 字幕（通话视图） ----------------
  function setSubtitle(text, animate) {
    if (typeHandle) { clearInterval(typeHandle); typeHandle = null; }
    if (!animate) { subtitleEl.textContent = text; return; }

    var i = 0;
    subtitleEl.textContent = "";
    typeHandle = setInterval(function () {
      i += 1;
      subtitleEl.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeHandle); typeHandle = null; }
    }, 28);
  }

  // ---------------- 形象 ----------------
  function fillFallback(layer, label) {
    var info = EMOTION[label] || EMOTION.neutral;
    layer.face.textContent = info.face;
    layer.cap.textContent = "表情占位 · " + info.cn;
  }

  // 把某张图放进「当前没在显示」的那一层，成功后翻转父容器的 data-layer。
  // talk=true 时优先试 expr_<表情>_talk.webp（伪口型），没有就退回静态图。
  function putImage(layer, label, talk) {
    var frame = layer.a.parentNode;
    var base = "/avatar/expr_" + label + ".webp";
    var url = (talk && talkKnown[label] !== false) ? ("/avatar/expr_" + label + "_talk.webp") : base;
    var target = (layer.show === "a") ? "b" : "a";
    var el = (target === "a") ? layer.a : layer.b;
    var token = ++layer.token;
    var trying = url;

    function attempt() {
      var probe = new Image();
      probe.onload = function () {
        if (token !== layer.token) { return; }      // 已有更新的请求，丢弃这次
        if (trying !== base) { talkKnown[label] = true; }
        el.src = trying;
        // ★ 第一次显示这张图时不要淡入：`.avatar-img` 有 200ms opacity 过渡，
        //   页面刚打开时它从 0 慢慢淡到 1，中途一瞥/截图就是"人物半透明、背景透出来"。
        //   换表情时才需要交叉淡入；首帧直接出图更像"她本来就在那儿"。
        if (!layer.ok) {
          el.style.transition = "none";
          frame.setAttribute("data-layer", target);
          void el.offsetWidth;
          requestAnimationFrame(function () { el.style.transition = ""; });
        } else {
          frame.setAttribute("data-layer", target);
        }
        layer.show = target;
        layer.ok = true;
        layer.fallback.style.visibility = "hidden";
        // 背景虚化层跟着换同一张图（用静态图，不用张嘴图，免得背景闪）
        if (layer.bg && !sceneLocked && layer.bg.getAttribute("src") !== base) {
          layer.bg.src = base;
        }
        // 换表情时闪一下柔光：让观众感觉是"她表情变了"，而不是图片被替换
        // 首次设置（上一张还空着）不闪 —— 页面刚打开不该有一次闪光
        if (layer.flash && layer.lastFlashExpr && layer.lastFlashExpr !== label) {
          layer.flash.classList.remove("fire");
          void layer.flash.offsetWidth;          // 强制重排，让动画能重复触发
          layer.flash.classList.add("fire");
        }
        layer.lastFlashExpr = label;
      };
      probe.onerror = function () {
        if (token !== layer.token) { return; }
        if (trying !== base) {                      // 张嘴图没有 → 退回静态图
          talkKnown[label] = false;
          trying = base;
          attempt();
          return;
        }
        if (!layer.ok) { layer.fallback.style.visibility = "visible"; }
      };
      probe.src = trying;
    }
    attempt();
  }

  // 换表情：先预加载，成功后再把图放进隐藏层、翻转父容器的 data-layer。
  // 不逐个 img 记状态，也不靠 complete/naturalWidth 猜加载时机 —— 这是之前
  // 「说伤心但表情一直是平静的笑」那个 bug 的根源。
  function setExpression(expr) {
    var label = EMOTION[expr] ? expr : "neutral";
    var info = EMOTION[label];
    if (badgeEmotion) { badgeEmotion.textContent = "她的表情 · " + info.cn; }

    var t = th3d();
    if (t) { t.mood(label); }           // 3D：切换情绪（微表情基调）

    ["call", "chat"].forEach(function (key) {
      var layer = layers[key];
      if (layer.expr === label) { return; }
      fillFallback(layer, label);
      layer.expr = label;
      putImage(layer, label, speaking);
    });
  }

  // 开始/停止说话时，在「张嘴图」和「静态图」之间切一次
  function refreshImages() {
    ["call", "chat"].forEach(function (key) {
      var layer = layers[key];
      if (layer.expr) { putImage(layer, layer.expr, speaking); }
    });
  }

  function setStageState(state) {
    var wasSpeaking = speaking;
    speaking = (state === "speaking");
    [stageEl, stageEl2].forEach(function (el) {
      if (!el) { return; }
      el.setAttribute("data-state", state);
    });
    badgeState.textContent = STATE_CN[state] || state;
    var waveEl = $("voice-wave");
    if (waveEl) { waveEl.classList.toggle("on", speaking); }
    if (wasSpeaking !== speaking) { refreshImages(); }
  }

  function setMeters(valence, arousal) {
    var v = Math.max(-1, Math.min(1, Number(valence) || 0));
    meterValence.style.width = (Math.abs(v) * 100) + "%";
    meterValence.classList.toggle("neg", v < 0);

    var a = Math.max(0, Math.min(1, Number(arousal) || 0));
    meterArousal.style.width = (a * 100) + "%";
    meterArousal.classList.remove("neg");
  }

  // ---------------- 语音播放 ----------------
  // 说话时的「声音反应」：把正在播的 mp3 接进 WebAudio，实时算音量，
  // 写进 CSS 变量 --voice（0~1）。形象的推近和下面的波形都读这个值。
  // 全程 try/catch 兜住 —— 取不到就只是没有动效，绝不影响播放本身。
  var audioCtx = null;
  var voiceAnalyser = null;
  var voiceSrc = null;
  var voiceRAF = 0;

  function stopVoiceMeter() {
    if (voiceRAF) { cancelAnimationFrame(voiceRAF); voiceRAF = 0; }
    document.documentElement.style.setProperty("--voice", "0");
  }

  // ★ 为什么必须先"预热"音频上下文：浏览器的自动播放策略会让新建的 AudioContext
  //   处于 suspended 状态，而一旦把 <audio> 接进一个没在运行的上下文，声音会**变成静音**。
  //   所以只在用户已经点过/敲过键、上下文确实 running 时才接管播放；
  //   拿不到就完全不接管 —— 宁可没有动效，也绝不能让语音不出声。
  function primeAudioContext() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      if (!audioCtx) { audioCtx = new AC(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { }
  }

  function startVoiceMeter(audio) {
    stopVoiceMeter();
    try {
      if (!audioCtx || audioCtx.state !== "running") { return; }
      if (!voiceAnalyser) {
        voiceAnalyser = audioCtx.createAnalyser();
        voiceAnalyser.fftSize = 512;
        voiceAnalyser.smoothingTimeConstant = 0.72;
      }
      if (voiceSrc) { try { voiceSrc.disconnect(); } catch (e) { } voiceSrc = null; }
      voiceSrc = audioCtx.createMediaElementSource(audio);
      voiceSrc.connect(voiceAnalyser);
      voiceAnalyser.connect(audioCtx.destination);
    } catch (e) {
      return;                                   // 不支持就算了，不影响播放
    }

    var buf = new Uint8Array(voiceAnalyser.fftSize);
    var root = document.documentElement;
    (function tick() {
      if (!voiceAnalyser) { return; }
      voiceAnalyser.getByteTimeDomainData(buf);
      var sum = 0;
      for (var i = 0; i < buf.length; i++) {
        var d = (buf[i] - 128) / 128;
        sum += d * d;
      }
      var rms = Math.sqrt(sum / buf.length);
      var v = Math.min(1, rms * 3.4);
      root.style.setProperty("--voice", v.toFixed(3));
      voiceRAF = requestAnimationFrame(tick);
    })();
  }

  function stopAudio() {
    stopVoiceMeter();
    var t = th3d();
    if (t) { t.stop(); }
    if (currentNode) {
      try { currentNode.pause(); } catch (e) { }
      currentNode = null;
    }
  }

  function playAudio(url, lipsync) {
    if (!url) { setStageState("idle"); return; }
    // 3D 就绪时：音频交给 TalkingHead 播放并驱动口型；失败返回 false 再走原 2D 路径
    var t = th3d();
    if (t && t.ready) {
      setStageState("speaking");
      t.speak(url, lipsync || null, function () {
        setStageState("idle");
      }).then(function (handled) {
        if (!handled) { play2dAudio(url); }
      });
      return;
    }
    play2dAudio(url);
  }

  function play2dAudio(url) {
    stopAudio();
    var audio = new Audio(url);
    currentNode = audio;
    setStageState("speaking");
    audio.onended = function () {
      stopVoiceMeter();
      if (currentNode === audio) { currentNode = null; setStageState("idle"); }
    };
    audio.onerror = function () {
      stopVoiceMeter();
      if (currentNode === audio) { currentNode = null; setStageState("idle"); }
      hint("语音文件没加载出来，只显示文字。", true);
    };
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () { stopVoiceMeter(); setStageState("idle"); });
    }
    startVoiceMeter(audio);
  }

  function hint(text, warn) {
    if (!hintEl) { return; }
    hintEl.textContent = text;
    hintEl.className = "hint" + (warn ? " warn" : "");
  }

  // ---------------- 发送 ----------------
  function setBusy(on) {
    busy = on;
    chatSend.disabled = on;
    chatInput.disabled = on;
    chatMic.disabled = on || !asrReady;
    callSend.disabled = on;
    callInput.disabled = on;
    talkingBtn.disabled = on || !asrReady;
    if (on) { setStageState("thinking"); }
  }

  function buildMeta(data, state) {
    var parts = [];
    if (typeof data.turn === "number") { parts.push("第 " + data.turn + " 轮"); }
    if (typeof data.latency_ms === "number") { parts.push(data.latency_ms + " ms"); }
    if (!data.audio_url) { parts.push("无语音"); }
    if (state === "speaking") { parts.push("正在说"); }
    return parts.join(" · ");
  }

  function send(payload) {
    if (busy) { return; }
    hideWelcome();
    var fd = new FormData();
    fd.append("session_id", sessionId);
    if (payload.audio) {
      fd.append("audio", payload.audio, "recording.webm");
    } else {
      fd.append("text", payload.text);
    }

    setBusy(true);
    hint("她正在想怎么回你……");
    var typing = addTyping();

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);

    fetch(API_CHAT, { method: "POST", body: fd, signal: ctrl.signal })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (body) {
          if (!body) { throw new Error("服务返回了看不懂的东西（HTTP " + res.status + "）"); }
          return body;
        });
      })
      .then(function (data) {
        removeEl(typing);

        var heard = (data.perception && data.perception.text) || payload.text || "（一段语音）";
        addRow("me", heard, payload.audio ? "语音" : "");

        if (data.error) {
          addRow("them", data.reply_text || "嗯……我这边出了点问题。").bubble.classList.add("err");
          setSubtitle(data.reply_text || "嗯……我这边出了点问题。", false);
          hint(String(data.error), true);
          if (data.avatar && data.avatar.expression) { setExpression(data.avatar.expression); }
          setStageState("idle");
          return;
        }

        var perception = data.perception || {};
        var response = data.response || {};
        var avatar = data.avatar || {};

        setExpression(avatar.expression || response.target_emotion || "neutral");
        setMeters(perception.valence, perception.arousal);

        var replyText = response.reply_text || "（没拿到回复）";
        setSubtitle(replyText, true);

        var audioUrl = data.audio_url || "";
        if (audioUrl) { playAudio(audioUrl, data.lipsync || null); } else { setStageState("idle"); }

        addRow("them", replyText, buildMeta(data, avatar.state || ""));
        hint(audioUrl ? "语音已生成，正在播放。" : "这条只显示了文字（TTS 没出声音）。");

        if (typeof data.latency_ms === "number") {
          console.log("[chat] turn=" + data.turn + " latency=" + data.latency_ms + " ms");
        }
      })
      .catch(function (err) {
        removeEl(typing);
        var aborted = !!(err && err.name === "AbortError");
        var row = addRow("them", aborted ? "我这边有点慢，没等到结果。" : "网络好像断了，稍后再试一次？");
        row.bubble.classList.add("err");
        setSubtitle(aborted ? "我这边有点慢，没等到结果。" : "网络好像断了，稍后再试一次？", false);

        var again = document.createElement("button");
        again.type = "button";
        again.className = "btn-ghost";
        again.textContent = "重试";
        again.style.marginTop = "6px";
        again.addEventListener("click", function () {
          removeEl(row.row);
          send(payload);
        });
        row.bubble.parentNode.appendChild(again);

        hint(aborted ? "超时了（45 秒没响应），可以点「重试」。"
                     : ("请求失败：" + (err && err.message ? err.message : "未知错误")), true);
        setStageState("idle");
      })
      .then(function () {
        clearTimeout(timer);
        setBusy(false);
        if (currentView === "chat") { chatInput.focus(); } else { callInput.focus(); }
      });
  }

  // ---------------- 录音 ----------------
  function canRecord() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function pickMime() {
    var cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    for (var i = 0; i < cands.length; i++) {
      if (MediaRecorder.isTypeSupported(cands[i])) { return cands[i]; }
    }
    return "";
  }

  function setTalkingUI(on) {
    isRecording = on;
    talkingBtn.classList.toggle("rec", on);
    talkingLabel.textContent = on ? "发送这段" : "按住说话";
    chatMic.textContent = on ? "发送这段" : "录音";
    setStageState(on ? "listening" : "idle");
  }

  function startRecording() {
    if (!canRecord()) { hint("这个浏览器不支持录音，用打字吧。", true); return; }
    if (!asrReady) { hint("语音识别没装，先用打字。", true); return; }
    var mime = pickMime();

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        chunks = [];
        recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

        recorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) { chunks.push(e.data); }
        };

        recorder.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          var blob = new Blob(chunks, { type: mime || "audio/webm" });
          chunks = [];
          if (blob.size < 1200) { hint("这段太短了，说完整一句。", true); return; }
          send({ audio: blob });
        };

        recorder.start();
        setTalkingUI(true);
        var t = th3d();
        if (t) { t.listen(stream); }    // 3D：听用户说话时做出反应（注视/点头）
        hint("正在听……说完再点一下（最长 30 秒）。");

        recordTimer = setTimeout(function () {
          if (isRecording) { stopRecording(); }
        }, MAX_RECORD_MS);
      })
      .catch(function (err) {
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          hint("麦克风被浏览器拦了，点地址栏的图标允许一下。", true);
        } else if (name === "NotFoundError") {
          hint("没找到麦克风设备。", true);
        } else {
          hint("开不了麦克风：" + (err && err.message ? err.message : "未知"), true);
        }
        setTalkingUI(false);
      });
  }

  function stopRecording() {
    if (recordTimer) { clearTimeout(recordTimer); recordTimer = null; }
    if (recorder && recorder.state !== "inactive") {
      try { recorder.stop(); } catch (e) { }
    }
    recorder = null;
    setTalkingUI(false);
    var t = th3d();
    if (t) { t.stopListen(); }
  }

  function toggleRecording() {
    if (busy) { return; }
    if (isRecording) { stopRecording(); } else { startRecording(); }
  }

  // ---------------- 摄像头（只做本地自拍预览） ----------------
  function cameraUnavailable(text) {
    cameraOn = false;
    pipEl.setAttribute("data-on", "0");
    pipOffEl.textContent = text;
    cameraBtn.classList.remove("on");
    cameraLabel.textContent = "摄像头";
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (t) { t.stop(); });
      cameraStream = null;
    }
    selfVideo.srcObject = null;
    cameraUnavailable("摄像头未开");
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraUnavailable("浏览器不支持摄像头");
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
      .then(function (stream) {
        cameraStream = stream;
        selfVideo.srcObject = stream;
        pipEl.setAttribute("data-on", "1");
        cameraOn = true;
        cameraBtn.classList.add("on");
        cameraLabel.textContent = "摄像头开";
        setView("call");
        hint("摄像头只在本地预览，画面不上传、不送模型。");
      })
      .catch(function (err) {
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          cameraUnavailable("摄像头被拦了，点地址栏图标允许");
        } else if (name === "NotFoundError") {
          cameraUnavailable("没有找到摄像头");
        } else {
          cameraUnavailable("摄像头打不开");
        }
        hint("摄像头不可用：" + (err && err.message ? err.message : "未知"), true);
      });
  }

  function toggleCamera() {
    if (cameraOn) { stopCamera(); } else { startCamera(); }
  }

  // ---------------- 通话计时 ----------------
  function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function startTimer() {
    callStartedAt = Date.now();
    callStatus.textContent = "通话中";
    callStatus.classList.remove("ended");
    if (timerHandle) { clearInterval(timerHandle); }
    callTimerEl.textContent = "00:00";
    timerHandle = setInterval(function () {
      callTimerEl.textContent = fmt(Math.floor((Date.now() - callStartedAt) / 1000));
    }, 1000);
  }

  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  function hangup() {
    stopTimer();
    stopAudio();
    stopCamera();
    if (isRecording) { stopRecording(); }
    callStatus.textContent = "已结束";
    callStatus.classList.add("ended");
    setStageState("idle");
    setSubtitle("通话结束了。想再聊就点「重新呼叫」。", false);

    var existing = document.getElementById("btn-recall");
    if (existing) { return; }
    var btn = document.createElement("button");
    btn.id = "btn-recall";
    btn.className = "chip";
    btn.type = "button";
    btn.textContent = "重新呼叫";
    btn.addEventListener("click", function () {
      btn.remove();
      startTimer();
      setSubtitle("我在呢。", false);
    });
    $("btn-hangup").parentNode.insertBefore(btn, $("btn-hangup"));
  }

  // ---------------- 健康检查 ----------------
  function setPill(el, ok) {
    if (!el) { return; }
    el.classList.remove("on", "off");
    el.classList.add(ok ? "on" : "off");
  }

  function checkHealth() {
    fetch(API_HEALTH)
      .then(function (r) { return r.json(); })
      .then(function (h) {
        setPill($("pill-asr"), !!h.asr);
        setPill($("pill-tts"), !!h.tts);

        var notes = [];
        if (!h.asr) { notes.push("语音识别没装（可以打字）"); }
        if (!h.tts) { notes.push("语音输出不可用（只有文字）"); }
        if (!h.llm) { notes.push("没配 DEEPSEEK_API_KEY，走的是内置 mock 回复"); }

        if (notes.length) { hint(notes.join("；"), true); }
        else { hint("一切正常。说一句试试。"); }

        asrReady = !!h.asr;
        if (!asrReady) {
          chatMic.disabled = true;
          chatMic.title = "语音识别没装（缺 faster-whisper），先用打字";
          chatMic.textContent = "语音未装";
          talkingBtn.disabled = true;
          talkingBtn.title = "语音识别没装，通话里先用下面的输入框打字";
          talkingLabel.textContent = "语音未装";
        }
      })
      .catch(function () {
        setPill($("pill-asr"), false);
        setPill($("pill-tts"), false);
        hint("连不上后端服务，确认 app.py 还在跑。", true);
      });
  }

  // ---------------- 重置 ----------------
  function resetSession() {
    if (busy) { return; }
    if (!window.confirm("清空这轮对话，重新开始？")) { return; }

    var fd = new FormData();
    fd.append("session_id", sessionId);

    fetch(API_RESET, { method: "POST", body: fd })
      .catch(function () { })
      .then(function () {
        stopAudio();
        logEl.innerHTML = "";
        layers.call.expr = "";
        layers.chat.expr = "";
        setExpression("neutral");
        setStageState("idle");
        setMeters(0, 0.4);
        addRow("them", "我在呢。今天过得怎么样？", "");
        setSubtitle("我在呢。今天过得怎么样？", false);
        hint("已经重新开始。");
        startTimer();
      });
  }

  // ---------------- 绑定 ----------------
  function sendFromChat() {
    var text = chatInput.value.trim();
    if (!text) { chatInput.focus(); return; }
    chatInput.value = "";
    send({ text: text });
  }

  // 欢迎卡：第一次开口就收起来（收起后不再出现，避免和聊天记录打架）
  function hideWelcome() {
    var el = $("welcome");
    if (el) { el.classList.add("hide"); }
  }

  function bindWelcome() {
    var el = $("welcome");
    if (!el) { return; }
    Array.prototype.forEach.call(el.querySelectorAll("button[data-say]"), function (btn) {
      btn.addEventListener("click", function () {
        if (busy) { return; }
        chatInput.value = btn.getAttribute("data-say") || "";
        setView("chat");
        sendFromChat();
      });
    });
  }

  function sendFromCall() {
    var text = callInput.value.trim();
    if (!text) { callInput.focus(); return; }
    callInput.value = "";
    send({ text: text });
  }

  function bind() {
    bindWelcome();
    ["pointerdown", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, primeAudioContext, { once: true, passive: true });
    });
    chatSend.addEventListener("click", sendFromChat);
    chatInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendFromChat(); }
    });

    callSend.addEventListener("click", sendFromCall);
    callInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendFromCall(); }
    });

    ["theme-sel", "theme-sel2"].forEach(function (id) {
      var s = $(id);
      if (s) { s.addEventListener("change", function () { setTheme(s.value); }); }
    });
    ["bg-sel", "bg-sel2"].forEach(function (id) {
      var s = $(id);
      if (s) { s.addEventListener("change", function () { if (s.value) { applyScene(s.value); } else { clearScene(); } }); }
    });
    $("btn-to-chat").addEventListener("click", function () { setView("chat"); });
    $("btn-to-call").addEventListener("click", function () { setView("call"); });
    $("btn-reset").addEventListener("click", resetSession);

    talkingBtn.addEventListener("click", toggleRecording);
    chatMic.addEventListener("click", toggleRecording);
    cameraBtn.addEventListener("click", toggleCamera);

    $("btn-mode-voice").addEventListener("click", function () {
      setView("call");
      stopCamera();
      hint("语音通话：说完自动识别并朗读回复。");
    });

    $("btn-mode-video").addEventListener("click", function () {
      setView("call");
      startCamera();
    });

    $("btn-hangup").addEventListener("click", hangup);

    window.addEventListener("beforeunload", function () {
      if (isRecording) { stopRecording(); }
      if (cameraStream) { cameraStream.getTracks().forEach(function (t) { t.stop(); }); }
    });
  }

  // ---------------- 启动 ----------------
  // 目光跟随：鼠标在舞台里移动，立绘朝鼠标方向轻移，像在看着你
  function bindGaze() {
    [stageEl, stageEl2].forEach(function (stage) {
      if (!stage) { return; }
      stage.addEventListener("pointermove", function (e) {
        var r = stage.getBoundingClientRect();
        stage.style.setProperty("--gx", (((e.clientX - r.left) / r.width) - 0.5).toFixed(3));
        stage.style.setProperty("--gy", (((e.clientY - r.top) / r.height) - 0.5).toFixed(3));
      });
      stage.addEventListener("pointerleave", function () {
        stage.style.setProperty("--gx", "0");
        stage.style.setProperty("--gy", "0");
      });
    });
  }

  // 背景场景：A 把背景图放 assets/images/bg_<名字>.webp，用 ?bg=<名字> 切换
  // 没有对应图时自动回落到「当前表情虚化」当背景，不会白屏
  var sceneLocked = false;
  function applyScene(name) {
    var url = "/avatar/bg_" + name + ".webp";
    var probe = new Image();
    probe.onload = function () {
      sceneLocked = true;
      ["call", "chat"].forEach(function (k) { if (layers[k].bg) { layers[k].bg.src = url; } });
      ["bg-sel", "bg-sel2"].forEach(function (id) { var s = $(id); if (s) { s.value = name; } });
      // ★ 场景要铺满**整个页面**，不是糊在人物框后面一块：
      //   把图写进 html 上的 CSS 变量，由 CSS 铺到 body 上；舞台面板同时变透明。
      document.documentElement.style.setProperty("--scene-img", "url(" + url + ")");
      document.documentElement.setAttribute("data-scene", "1");
    };
    probe.onerror = function () { sceneLocked = false; };
    probe.src = url;
  }

  // 背景回到「自动」：跟着当前表情虚化走
  function clearScene() {
    sceneLocked = false;
    ["call", "chat"].forEach(function (k) {
      var l = layers[k];
      if (l.bg && l.expr) { l.bg.src = "/avatar/expr_" + l.expr + ".webp"; }
    });
    ["bg-sel", "bg-sel2"].forEach(function (id) { var s = $(id); if (s) { s.value = ""; } });
    document.documentElement.removeAttribute("data-scene");
    document.documentElement.style.removeProperty("--scene-img");
  }

  function init() {
    ensureSession();
    setTheme(initialTheme(), false);
    bind();
    bindGaze();
    setView(initialView());
    setStageState("idle");
    setExpression("neutral");

    // 调试 / 演示用参数：
    //   ?expr=sad      直接定在某一张表情（等价于走一次换图，可当回归用）
    //   ?cycle=1       每 900ms 自动换一张，用来确认换图真的生效
    //   ?state=speaking 直接把状态设成"说话中"（看波形/光晕）
    //   ?voice=0.6     把音量固定成 0.6（检查"随声音推近"的视觉，不依赖真实音频）
    //   ?voiceauto=1   让音量自己起伏（这台机器没声音时也能看动效对不对）
    var forced = (location.search.match(/[?&]expr=([a-z]+)/) || [])[1];
    if (forced && EMOTION[forced]) { setExpression(forced); }
    if (/[?&]state=speaking\b/.test(location.search)) { setStageState("speaking"); }
    var fixedVoice = (location.search.match(/[?&]voice=([0-9.]+)/) || [])[1];
    if (fixedVoice) { document.documentElement.style.setProperty("--voice", fixedVoice); }
    if (/[?&]voiceauto=1\b/.test(location.search)) {
      setStageState("speaking");
      var vStart = Date.now();
      setInterval(function () {
        var v = 0.45 + 0.45 * Math.abs(Math.sin((Date.now() - vStart) / 380));
        document.documentElement.style.setProperty("--voice", v.toFixed(3));
      }, 60);
    }
    if (/[?&]cycle=1\b/.test(location.search)) {
      var seq = ["sad", "happy", "angry", "empathic", "anxious", "surprised"];
      var idx = 0;
      var handle = setInterval(function () {
        if (idx >= seq.length) { clearInterval(handle); return; }
        setExpression(seq[idx]);
        idx += 1;
      }, 900);
    }
    var bgScene = (location.search.match(/[?&]bg=([a-z0-9_-]+)/) || [])[1];
    if (bgScene) { applyScene(bgScene); }

    setMeters(0, 0.4);
    addRow("them", "我在呢。今天过得怎么样？", "");
    setSubtitle("我在呢。今天过得怎么样？", false);
    startTimer();
    checkHealth();
    if (currentView === "chat") { chatInput.focus(); } else { callInput.focus(); }
  }

  // ---------------- 桌面小人（B 追加）----------------
  // Q 版立绘浮在右下角：会呼吸、会眨眼（用的是真实的闭眼立绘，不是缩放糊弄）、
  // 跟着智能体的表情变脸、点她弹一下并说句话、可以拖到屏幕别处。
  var pet = (function () {
    var layer = $("pet-layer");
    var body = $("pet-body");
    var img = $("pet-img");
    var bubble = $("pet-bubble");
    var closeBtn = $("pet-close");
    if (!layer || !body || !img) { return null; }

    var ASSETS = {
      calm: "/pet/q_calm.webp",
      happy: "/pet/q_happy.webp",
      sad: "/pet/q_sad.webp",
      surprised: "/pet/q_surprised.webp",
      blink: "/pet/q_blink.webp",
      talk: "/pet/q_talk.webp",
      happy_talk: "/pet/q_happy_talk.webp",
      sad_talk: "/pet/q_sad_talk.webp",
      angry: "/pet/q_angry.webp",
      angry_talk: "/pet/q_angry_talk.webp",
      wave: "/pet/q_wave.webp",
    };
    var ready = {};
    Object.keys(ASSETS).forEach(function (k) {
      var im = new Image();
      im.onload = function () { ready[k] = true; };
      im.src = ASSETS[k];
    });

    var mood = "calm";        // 当前表情
    var blinking = false;
    var bubbleTimer = 0;
    var blinkTimer = 0;

    // 智能体表情 → 小人表情
    var MOOD_MAP = {
      happy: "happy", surprised: "surprised",
      sad: "sad", angry: "angry",
      neutral: "calm", anxious: "calm", empathic: "calm"
    };

    // 临时覆盖图（招手）：非空时优先显示它，用于"挥手打招呼"这种一次性动作
    var override = "";
    var waveTimer = 0;
    var waveUntil = 0;
    function wave(ms) {
      var dur = ms || 1500;
      var until = Date.now() + dur;
      override = "wave";
      paint();
      // 已经有一次更长的招手在跑时，不要被短的招手提前收掉（踩过：进场问候把招手掐断）
      if (until <= waveUntil) { return; }
      waveUntil = until;
      clearTimeout(waveTimer);
      waveTimer = setTimeout(function () { override = ""; waveUntil = 0; paint(); }, dur);
    }

    function paint() {
      var key = override || (blinking ? "blink" : mood);
      var url = ASSETS[key] || ASSETS.calm;
      if (img.getAttribute("src") !== url) { img.src = url; }
    }

    function scheduleBlink() {
      clearTimeout(blinkTimer);
      var wait = 2200 + Math.random() * 3600;
      blinkTimer = setTimeout(function () {
        blinking = true;
        paint();
        setTimeout(function () { blinking = false; paint(); scheduleBlink(); }, 130);
      }, wait);
    }

    function say(text, holdMs) {
      if (!bubble || !text) { return; }
      var textEl = $("pet-bubble-text");
      if (textEl) { textEl.textContent = text; }
      bubble.classList.add("on");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(function () { bubble.classList.remove("on"); },
        holdMs || (1200 + text.length * 80));
    }

    // 摸头：按下去时整个身体被压扁下沉，松手回弹并轻微超出，再稳住
    function pat() {
      clearActs();
      void body.offsetWidth;
      body.classList.add("act-pat");
      var heart = $("pet-heart");
      if (heart) {
        heart.classList.remove("on");
        void heart.offsetWidth;
        heart.classList.add("on");
      }
      setTimeout(function () { body.classList.remove("act-pat"); }, 820);
      setTimeout(function () { if (heart) { heart.classList.remove("on"); } }, 900);
    }

    function bounce() {
      body.classList.remove("bounce");
      void body.offsetWidth;
      body.classList.add("bounce");
    }

    var PET_LINES = [
      "我在这儿呢～", "要我陪你待一会儿吗？", "点我有事吗？",
      "嘿嘿，被你点到了。", "累的话就靠一会儿吧。"
    ];

    body.addEventListener("click", function (e) {
      if (dragged) { return; }
      pat();   // 摸头：压扁下沉 + 回弹 + 头顶爱心
      say(PET_LINES[Math.floor(Math.random() * PET_LINES.length)]);
      e.stopPropagation();
    });

    // 拖动：把 fixed 的 right/bottom 换成 left/top 再跟着鼠标走
    var dragging = false, dragged = false, startX = 0, startY = 0, origL = 0, origT = 0;
    body.addEventListener("pointerdown", function (e) {
      var r = layer.getBoundingClientRect();
      dragging = true; dragged = false;
      startX = e.clientX; startY = e.clientY;
      origL = r.left; origT = r.top;
      layer.style.right = "auto";
      layer.style.bottom = "auto";
      layer.style.left = origL + "px";
      layer.style.top = origT + "px";
      body.setPointerCapture(e.pointerId);
    });
    body.addEventListener("pointermove", function (e) {
      if (!dragging) { return; }
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) { dragged = true; }
      layer.style.left = (origL + dx) + "px";
      layer.style.top = (origT + dy) + "px";
    });
    body.addEventListener("pointerup", function (e) {
      dragging = false;
      try { body.releasePointerCapture(e.pointerId); } catch (err) { }
      setTimeout(function () { dragged = false; }, 30);
    });

    if (closeBtn) {
      closeBtn.addEventListener("click", function (e) {
        document.documentElement.setAttribute("data-pet", "0");
        e.stopPropagation();
      });
    }

    // ---- 说话：在"当前表情"和"张嘴"之间快速交替，看起来像在讲话 ----
    var talkTimer = 0;
    var talking = false;
    function startTalk() {
      if (talking) { return; }
      talking = true;
      var open = false;
      talkTimer = setInterval(function () {
        open = !open;
        var openSrc = ASSETS[mood + "_talk"] || ASSETS.talk;
        img.src = open ? openSrc : (ASSETS[mood] || ASSETS.calm);
      }, 115);
    }
    function stopTalk() {
      if (!talking) { return; }
      talking = false;
      clearInterval(talkTimer);
      paint();
    }

    // ---- 待机随机小动作：蹦 / 摇摆 / 歪头 / 左右挪 / 鼓起 / 抖一下 ----
    var ACTS = ["act-hop", "act-sway", "act-lean", "act-slide", "act-pulse", "act-shake"];
    function clearActs() { ACTS.forEach(function (a) { body.classList.remove(a); }); }
    function doAct() {
      clearActs();
      var a = ACTS[Math.floor(Math.random() * ACTS.length)];
      void body.offsetWidth;
      body.classList.add(a);
      setTimeout(clearActs, 1900);
    }
    var actTimer = 0;
    function scheduleAct() {
      clearTimeout(actTimer);
      actTimer = setTimeout(function () {
        if (!talking && !document.hidden) { if (Math.random() < 0.3) { wave(1500); } else { doAct(); } }
        scheduleAct();
      }, 5000 + Math.random() * 7000);
    }

    paint();
    scheduleBlink();
    scheduleAct();
    // 一进页面先招手打个招呼（1.2 秒后，等图都解码完）
    setTimeout(function () { wave(1600); }, 1200);
    return {
      startTalk: startTalk,
      stopTalk: stopTalk,
      act: doAct,
      pat: pat,
      wave: wave,
      setMood: function (expr) {
        var m = MOOD_MAP[expr] || "calm";
        if (m === mood) { return; }
        mood = m;
        paint();
      },
      say: say,
      bounce: bounce
    };
  })();

  // 让小人跟着智能体的表情走：包一层 setExpression，不去改它原来的逻辑
  (function hookPetMood() {
    if (!pet || typeof setExpression !== "function") { return; }
    var orig = setExpression;
    setExpression = function (expr) {
      orig.apply(null, arguments);
      try { pet.setMood(expr); } catch (e) { }
    };
  })();

  // 说话时让小人张嘴：包一层 setStageState，speaking 时开始/停止口型交替
  (function hookPetTalk() {
    if (!pet || typeof setStageState !== "function") { return; }
    var origState = setStageState;
    setStageState = function (state) {
      origState.apply(null, arguments);
      try {
        if (state === "speaking") { pet.startTalk(); } else { pet.stopTalk(); }
      } catch (e) { }
    };
  })();

  // 调试/截图用：?petbubble=1 直接弹一个气泡出来，方便确认气泡样式
  (function petDebug() {
    if (!pet) { return; }
    // ?petbubble=1 弹气泡；?petwave=1 立刻招手；?petmood=angry 定在某表情；?petact=hop 预览动作
    if (/[?&]petbubble=1\b/.test(location.search)) {
      pet.say("你好呀，我是小戴～ 点我可以跟我说话", 60000);
      var bb = document.getElementById("pet-bubble");
      if (bb) { bb.style.transition = "none"; bb.style.opacity = "1"; bb.style.transform = "none"; }
    }
    if (/[?&]petwave=1\b/.test(location.search)) { pet.wave(60000); }
    var mm = location.search.match(/[?&]petmood=([a-z]+)/);
    // 延后执行：init() 里还会 setExpression("neutral")，立刻设会被它覆盖掉（踩过）
    if (mm && mm[1]) {
      // 反复设几遍：init() 里的 setExpression("neutral") 如果比我们晚跑会把表情盖回 calm
      var nSet = 0;
      var holdMood = setInterval(function () {
        pet.setMood(mm[1]);
        if (++nSet >= 12) { clearInterval(holdMood); }
      }, 150);
    }
    if (/[?&]petact=([a-z]+)/.test(location.search)) {
      var mact = location.search.match(/[?&]petact=([a-z]+)/);
      setTimeout(function () {
        var body = document.querySelector(".pet-body");
        if (body && mact) { body.classList.add("act-" + mact[1]); }
      }, 300);
    }
  })();

  // 调试：?petclick=1 真的对小人派发一次 click，用来端到端验证"摸头"链路
  (function petClickDebug() {
    if (!/[?&]petclick=1\b/.test(location.search)) { return; }
    setTimeout(function () {
      var b = document.querySelector(".pet-body");
      if (b) { b.click(); }
    }, 260);
  })();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

<!-- ===================== 3D 形象引擎（TalkingHead） =====================
     就绪条件（缺一不可，缺了就悄悄沿用 2D 立绘，不影响任何功能）：
       · 浏览器支持 WebGL2
       · /static/avatar/xiaoyu.glb 存在（Ready Player Me 全身模型，
         下载时 URL 要带 morphTargets=ARKit,Oculus Visemes）
     能力：真实口型同步（edge-tts 逐词时间戳 + lipsync-zh 视素映射）、
           眨眼/呼吸/头部微动/眉毛小动作（TalkingHead 情绪引擎自带）、
           情绪基调（setMood）、听用户说话时的注视反应（startListening）。
-->
<script type="module">
import { TalkingHead } from '/static/vendor/talkinghead.mjs';

// 契约情绪标签 → TalkingHead 情绪（它没有 anxious/surprised/empathic，就近映射）
const MOOD_MAP = {
  neutral: 'neutral', happy: 'happy', sad: 'sad',
  anxious: 'fear', angry: 'angry', surprised: 'happy', empathic: 'love'
};

const GLB_URL = '/static/avatar/xiaoyu.glb';

let head = null;          // TalkingHead 实例
let ready = false;        // 3D 是否可用（false 时主脚本全部走 2D 原逻辑）
let pendingMood = 'neutral';
let speakPoll = null;     // 播完检测定时器
let meterRAF = 0;         // 音量表 rAF
let listenSrc = null;
let listenAnalyser = null;

function mountPoint(view) {
  return document.getElementById(view === 'chat' ? 'avatar3d-chat' : 'avatar3d-call');
}

// 说话时把 TalkingHead 的语音分析器读数写进 --voice，
// 让波形条和"随声音推近"动效在 3D 模式下也照常工作
function startMeter() {
  stopMeter();
  const buf = new Uint8Array(256);
  const root = document.documentElement;
  (function tick() {
    if (!head) { return; }
    try {
      head.audioAnalyzerNode.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
      root.style.setProperty('--voice', Math.min(1, Math.sqrt(sum / buf.length) * 3.4).toFixed(3));
    } catch (e) { /* 忽略单帧失败 */ }
    meterRAF = requestAnimationFrame(tick);
  })();
}

function stopMeter() {
  if (meterRAF) { cancelAnimationFrame(meterRAF); meterRAF = 0; }
  document.documentElement.style.setProperty('--voice', '0');
}

const api = {
  get ready() { return ready; },

  // 情绪切换（没就绪时先记下来，就绪后补应用）
  mood(label) {
    pendingMood = label;
    if (ready && head) {
      try { head.setMood(MOOD_MAP[label] || 'neutral'); } catch (e) { }
    }
  },

  // 播放回复语音 + 口型同步。返回 Promise<boolean>：false = 没接住，调用方走 2D 兜底
  async speak(url, lipsync, onended) {
    if (!ready || !head) { return false; }
    try {
      const buf = await (await fetch(url)).arrayBuffer();
      const audio = await head.audioCtx.decodeAudioData(buf);
      if (head.audioCtx.state === 'suspended') {
        try { await head.audioCtx.resume(); } catch (e) { }
      }
      const payload = { audio };
      if (lipsync && lipsync.words && lipsync.words.length) {
        payload.words = lipsync.words;
        payload.wtimes = lipsync.wtimes;
        payload.wdurations = lipsync.wdurations;
      }
      head.speakAudio(payload, { lipsyncLang: 'zh' });
      startMeter();

      // TalkingHead 没有对外暴露"播完"回调，轮询状态位判断
      if (speakPoll) { clearInterval(speakPoll); }
      let seen = false;
      speakPoll = setInterval(function () {
        const speaking = head.isSpeaking || head.isAudioPlaying;
        if (speaking) { seen = true; }
        if (seen && !speaking) {
          clearInterval(speakPoll); speakPoll = null;
          stopMeter();
          if (onended) { onended(); }
        }
      }, 150);
      return true;
    } catch (e) {
      console.warn('[avatar3d] speak 失败，回退 2D 播放：', e);
      return false;
    }
  },

  stop() {
    if (speakPoll) { clearInterval(speakPoll); speakPoll = null; }
    stopMeter();
    if (ready && head) { try { head.stopSpeaking(); } catch (e) { } }
  },

  // 视图切换：把同一个 3D 画布搬到当前视图的挂载点
  attach(view) {
    if (!ready || !head) { return; }
    const mp = mountPoint(view);
    if (mp && head.nodeAvatar.parentNode !== mp) { mp.appendChild(head.nodeAvatar); }
    try { head.onResize(); } catch (e) { }
  },

  // 用户录音时，把麦克风流接进来 —— 她会看向说话的人、有"在听"的头部反应
  listen(stream) {
    if (!ready || !head || !stream) { return; }
    try {
      if (!listenAnalyser) { listenAnalyser = head.audioCtx.createAnalyser(); }
      listenSrc = head.audioCtx.createMediaStreamSource(stream);
      listenSrc.connect(listenAnalyser);
      head.startListening(listenAnalyser);
    } catch (e) { }
  },

  stopListen() {
    try { if (ready && head) { head.stopListening(); } } catch (e) { }
    try { if (listenSrc) { listenSrc.disconnect(); } } catch (e) { }
    listenSrc = null;
  }
};
window.avatar3d = api;

async function boot() {
  try {
    if (!window.WebGL2RenderingContext) { return; }
    // ★ 应急开关：地址加 ?no3d=1（或 ?avatar3d=0）强制用 2D 立绘。
    //   3D 效果不理想或现场显卡不给力时，用它一秒钟退回 2D，不用改代码、不用重开服务。
    if (/[?&](no3d=1|avatar3d=0)\b/.test(location.search)) {
      console.info("[avatar3d] 已用 ?no3d=1 强制关闭，使用 2D 立绘");
      return;
    }

    // 模型文件不存在就不启动（probe 用 HEAD，几秒就能出结果）
    const probe = await fetch(GLB_URL, { method: 'HEAD' });
    if (!probe.ok) {
      console.info('[avatar3d] 未找到 3D 模型 ' + GLB_URL + '，沿用 2D 立绘。获取方法见 static/avatar/下载形象模型.md');
      return;
    }

    const mount = document.createElement('div');
    mount.className = 'avatar3d-canvas';
    mountPoint(document.getElementById('view-chat').hidden ? 'call' : 'chat').appendChild(mount);

    head = new TalkingHead(mount, {
      lipsyncLang: 'zh',
      lipsyncModules: ['zh'],          // 只加载本地中文模块（默认的 fi/en/lt 没打包进来）
      cameraView: 'upper',             // 上半身取景，适合对话场景
      cameraRotateEnable: false,
      cameraZoomEnable: false,
      modelPixelRatio: Math.min(2, window.devicePixelRatio || 1)
    });

    await head.showAvatar({
      url: GLB_URL,
      body: 'F',
      avatarMood: 'neutral',
      lipsyncLang: 'zh'
    });
    head.setView('upper');

    // 等中文唇形模块动态 import 完成（最多 3 秒，等不到也能播，只是口型用不上视素）
    const t0 = Date.now();
    while (!head.lipsync['zh'] && Date.now() - t0 < 3000) {
      await new Promise(function (r) { setTimeout(r, 100); });
    }

    // 浏览器自动播放策略：首次点击/按键时恢复音频上下文
    ['pointerdown', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        try { head.audioCtx.resume(); } catch (e) { }
      }, { passive: true });
    });

    head.setMood(MOOD_MAP[pendingMood] || 'neutral');
    ready = true;
    document.querySelectorAll('.stage').forEach(function (s) { s.setAttribute('data-avatar3d', '1'); });
    api.attach(document.getElementById('view-chat').hidden ? 'call' : 'chat');
    console.info('[avatar3d] 3D 形象已就绪');
  } catch (e) {
    console.warn('[avatar3d] 初始化失败，沿用 2D 立绘：', e);
    try { if (head) { head.stop(); } } catch (e2) { }
    head = null;
    ready = false;
  }
}

boot();
</script>
</body>
</html>
